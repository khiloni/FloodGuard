  '{n1} residents of {p1} returned home from the shelter.': '{p1}-এর {n1} জন বাসিন্দা আশ্রয়কেন্দ্র থেকে বাড়ি ফিরেছেন।'
  '{n1} residents reported stomach illness linked to unsafe water.': '{n1} জন বাসিন্দা অনিরাপদ জলের কারণে পেটের অসুখে আক্রান্ত।'
  '{n1} stranded residents reached the shelter.': '{n1} জন আটকে পড়া বাসিন্দা আশ্রয়কেন্দ্রে পৌঁছেছেন।'
  '{n1} truck(s) are free while the roads are still open.': রাস্তা খোলা থাকা পর্যন্ত {n1}টি ট্রাক খালি।
  '{n1} truck(s) carry {n2} each while the road is dry; they stop once it floods.': রাস্তা শুকনো থাকা পর্যন্ত {n1}টি ট্রাক, প্রতিটি {n2} জনকে নিয়ে যায়; জল জমলেই থেমে যায়।
  '{n1} vulnerable individuals from {p1} reached secure shelter.': '{p1}-এর {n1} জন দুর্বল মানুষ নিরাপদ আশ্রয়ে পৌঁছেছেন।'
  '{n1} vulnerable residents are still at home.': '{n1} জন দুর্বল বাসিন্দা এখনও বাড়িতে।'
  '{n1} vulnerable residents in {p1} move first; others wait a little longer.': '{p1}-এর {n1} জন দুর্বল বাসিন্দা আগে যান; বাকিরা একটু অপেক্ষা করেন।'
  '{n1} ward(s) had been flooded.': '{n1}টি ওয়ার্ড ডুবে গিয়েছিল।'
  '{p1} has already been surveyed.': '{p1} ইতিমধ্যে সমীক্ষা করা হয়েছে।'
  '{p1} is still under {n1} cm of water.': '{p1} এখনও {n1} সেমি জলের নিচে।'
  '{p1} must have a damage survey before residents return.': বাসিন্দারা ফেরার আগে {p1}-এর ক্ষতি সমীক্ষা দরকার।
  '{p1} needs clear direction.': '{p1}-এর স্পষ্ট নির্দেশ দরকার।'
  '{p1} stayed dry; its residents are safe at home and need no rescue.': '{p1} শুকনো ছিল; সেখানকার বাসিন্দারা বাড়িতে নিরাপদ এবং উদ্ধারের দরকার নেই।'
  '{p1} was not flooded; no damage survey is needed.': '{p1}-এ বন্যা হয়নি; ক্ষতি সমীক্ষার দরকার নেই।'
  '{p1}: The medical camp treated {n1} residents.': '{p1}: চিকিৎসা শিবির {n1} জন বাসিন্দার চিকিৎসা করেছে।'
scenarios:
  cyclone-surge-01:
    name: মাছিওয়াড়ায় ঘূর্ণিঝড়
    hazard_label: ঘূর্ণিঝড়ের জলোচ্ছ্বাস
    hook: ঘূর্ণিঝড় কয়েক ঘণ্টার মধ্যে আঘাত হানবে, মাছ ধরার নৌকা এখনও সমুদ্রে, আর ঘূর্ণিঝড় আশ্রয়কেন্দ্রে সবার জায়গা নেই।
    description: একটি প্রবল ঘূর্ণিঝড় জেলেদের গ্রামের দিকে আসছে। জলোচ্ছ্বাস সমুদ্রকে সমুদ্র দেয়ালের উপর দিয়ে ঠেলে দেবে। আঘাতের আগে মানুষকে সরান, নৌকাগুলো ফেরত ডাকুন এবং ভিড় করা ঘূর্ণিঝড় আশ্রয়কেন্দ্র সামলান।
    npcs:
      village_head: আমাদের আটটা নৌকা সতর্কতার আগেই বেরিয়ে গিয়েছিল। তাদের পরিবার সৈকতে জিজ্ঞেস করছে কী করবে।
      rescue_worker: আমরা রেডিওতে জেলেদের সঙ্গে যোগাযোগ করতে পারি, কিন্তু তাদের বন্দরে ফিরতে প্রায় দেড় ঘণ্টা লাগবে।
      family_member: আমার স্বামী এখনও সমুদ্রে আর আমার শ্বশুর শয্যাশায়ী। আমি দুজনকে ছেড়ে যেতে পারি না।
      health_worker: ঘূর্ণিঝড় আশ্রয়কেন্দ্রে খুব ভিড় হয়। পরিষ্কার জল ও চিকিৎসা শিবিরের পরিকল্পনা করা উচিত।
      district_official: রাজ্য নৌকা ও ত্রাণ পাঠাতে পারে, কিন্তু বাতাস বাড়লেই রাস্তা কেটে যাবে।
  dam-release-01:
    name: কালিন্দী বাঁধের নিচে
    hazard_label: বাঁধ থেকে জল ছাড়া
    hook: বাঁধকে কয়েক ঘণ্টার মধ্যে জল ছাড়তে হবে। আপনি কি প্রতিটি গ্রামকে সময়মতো সতর্ক করতে পারবেন, আর জল ছাড়া ধীর করাতে পারবেন?
    description: উজানে ভারী বৃষ্টির কারণে কালিন্দী বাঁধ থেকে নির্ধারিত জল ছাড়তে হবে। নিচের নদী ইতিমধ্যে উঁচু। সময় আর প্রতিটি গ্রামে বার্তা পৌঁছানোই ফলাফল ঠিক করবে।
    npcs:
      village_head: এখানকার অনেক পরিবার নদীর পাড়ে চাষ করে। বাঁধ না জানিয়ে খুললে তারা খেতে আটকে পড়বে।
      rescue_worker: ঘাটে আমাদের তিনটি নৌকা আর দুটি জিপ আছে। মন্দির পাড়ার নিচু সেতু তাড়াতাড়ি ডুবে যায়।
      family_member: আমার মা বেশি দূর হাঁটতে পারেন না। জল আসার আগে কেউ কি আমাদের জানাবে?
      health_worker: আমি জানি কোন বাড়িতে বয়স্ক ও গর্ভবতী মহিলা আছেন। তাঁদের আগে সরাতে হবে।
      district_official: বাঁধ নিরাপদ রাখতে প্রকৌশলীদের জল ছাড়তেই হবে। আগে বললে তাঁরা ধীরে ছাড়তে রাজি হতে পারেন।
  glacial-lake-01:
    name: ৎসোমো উপত্যকার উপরে হিমবাহ হ্রদ বিস্ফোরণ
    hazard_label: হিমবাহ হ্রদ বিস্ফোরণ
    hook: উপত্যকার উপরের হ্রদের সেন্সর এইমাত্র সতর্কসংকেত দিয়েছে। জল আর পাথরের ঢল আসতে প্রায় দুই ঘণ্টা বাকি।
    description: পাহাড়ি উপত্যকার উপরের হিমবাহ হ্রদের সেন্সর সতর্ক করছে যে তার মোরেন দেয়াল ভেঙে পড়তে পারে। হ্রদ ফাটলে জল আর ধ্বংসাবশেষের দেয়াল কয়েক ঘণ্টায় উপত্যকায় পৌঁছাবে। অল্প সময়ে সবাইকে উপরে নিয়ে যান, তারপর উপত্যকা আবার খুলুন।
    npcs:
      village_head: দোকানদাররা বলছেন নদী একটু বেড়েছে মাত্র। সতর্কতা স্পষ্ট আর জোরালো না হলে তাঁরা বাজার বন্ধ করবেন না।
      rescue_worker: চারটি ট্রাক, একটি রবারের ভেলা। ধ্বংসাবশেষের ঢলে ভেলা কোনো কাজের নয়; রাস্তা থাকা পর্যন্ত ট্রাকই আমাদের ভরসা।
      family_member: আমার ঠাকুমার বয়স নব্বই, তিনি মঠের সিঁড়ি উঠতে পারেন না। অনুগ্রহ করে বয়স্কদের জন্য আগে গাড়ি পাঠান।
      health_worker: শৈলশিরার ঠান্ডা রাত শিশু ও বয়স্কদের জন্য কঠিন হবে। আমাদের কম্বল, পরিষ্কার জল ও চিকিৎসা শিবির লাগবে।
      district_official: হ্রদের সেন্সর সতর্কসংকেত পাঠিয়েছে। মোবাইল সতর্কবার্তা তৈরি, কিন্তু সাইরেন বাজানোর সিদ্ধান্ত আপনার।
  river-island-01:
    name: 'কমলপুর চর: নদীর মাঝে এক দ্বীপ'
    hazard_label: নদীর চরে বন্যা
    hook: ফুলে ওঠা নদীর মাঝে বালির চরে দুটি পাড়া। দ্বীপ থেকে কোনো রাস্তা নেই, কেবল নৌকা, আর নদী প্রতি ঘণ্টায় বাড়ছে।
    description: 'একটি বড় নদীতে বর্ষার বন্যা বালির চরকে ঘিরে ফেলছে। মূল ভূখণ্ডে কোনো রাস্তা নেই: প্রতিবার পার হতে নৌকা লাগে। চরের পরিবারগুলোকে আগে সরান, বেষ্টনী বাঁধ টিকিয়ে রাখুন, তারপর সবাইকে বাড়ি ফেরান।'
    npcs:
      village_head: প্রতি বর্ষায় নদী আমাদের দ্বীপের আরও একটু খেয়ে নেয়। বিশ্বস্ত কেউ আগে না বললে মানুষ তাদের গরু আর তাঁত ছাড়বে না।
      rescue_worker: ঘাটে ইঞ্জিনচালিত তিনটি দেশি নৌকা বাঁধা আছে। প্রতিবার পার হতে সময় লাগে, আর নদী বাড়লে স্রোত আরও জোরালো হয়।
      family_member: আমার ছোটটার জ্বর আর আমার শাশুড়ি বেশি দূর হাঁটতে পারেন না। জল উঠোনে এলে আমরা আটকে পড়ব।
      health_worker: জল নামার পরে মানুষ ডুবে যাওয়া টিউবওয়েলের জল খায়। আমাদের ক্লোরিন ট্যাবলেট আর মাচানের উপর চিকিৎসা শিবির দরকার।
      district_official: জেলা আরও নৌকা ও ত্রাণ পাঠাতে পারে, কিন্তু সেগুলো আগে সড়কপথে ঘাটে আসে, তারপর জলপথে।
  urban-flash-flood-01:
    name: ওয়ার্ড 14-এর আকস্মিক বন্যা
    hazard_label: শহুরে আকস্মিক বন্যা
    hook: ঘনবসতিপূর্ণ এক শহুরে ওয়ার্ডে মেঘভাঙা বৃষ্টি। নর্দমা বন্ধ, আন্ডারপাস সবার আগে ভরে যায়, আর আপনার হাতে ঘণ্টা নয়, মিনিট।
    description: শহরের একটি ওয়ার্ডে মেঘভাঙা বৃষ্টি। বন্ধ নর্দমা আর রেলওয়ে আন্ডারপাস কয়েক মিনিটে রাস্তাকে নালায় পরিণত করে। দ্রুত কাজ করুন, তারপর বিদ্যুৎ, রাস্তা আর নিরাপদ জল ফিরিয়ে আনুন।
    npcs:
      village_head: বাজারের পেছনের নর্দমা আবার প্লাস্টিকে আটকে গেছে। বৃষ্টি চলতে থাকলে আন্ডারপাস সবার আগে ভরবে।
      rescue_worker: আমাদের দুটি উদ্ধার ডিঙি আর চারটি ট্রাক আছে। জল ফুটপাতের উপরে উঠলে ট্রাক আন্ডারপাস দিয়ে যেতে পারে না।
      family_member: আমাদের গলিতে ইতিমধ্যে গোড়ালি পর্যন্ত জল আর আমার প্রতিবেশী হুইলচেয়ার ব্যবহার করেন।
      health_worker: নর্দমার জল মেশা বন্যার জল গুরুতর ঝুঁকি। পরে আমাদের দ্রুত পরিষ্কার জল লাগবে।
      district_official: রাজ্য দুর্যোগ বাহিনী নৌকা পাঠাতে পারে, কিন্তু এই ওয়ার্ডে পৌঁছাতে তাদের কয়েক ঘণ্টা লাগবে।
  village-river-01:
    name: নদীতীরের গ্রামে বন্যা ত্রাণ
    hazard_label: নদীর বন্যা
    hook: বর্ষার একটি উপনদী তিনটি ওয়ার্ডের পাশে ফুলে উঠছে। সতর্ক করুন, সরিয়ে নিন আর বাঁধ রক্ষা করুন, তারপর পুনর্বাসনের নেতৃত্ব দিন।
    description: 'ফুলে ওঠা উপনদী তিনটি ওয়ার্ডকে বিপদে ফেলছে। বন্যা চূড়ায় পৌঁছানোর আগে সতর্ক করুন ও সরিয়ে নিন, বন্যার সময় মানুষকে রক্ষা করুন, তারপর পুনর্বাসনের নেতৃত্ব দিন: পরিষ্কার জল, চিকিৎসা, বিদ্যুৎ, রাস্তা আর নিরাপদে বাড়ি ফেরা।'
    npcs:
      village_head: ওয়ার্ড 1-এর কাছে জল দ্রুত বাড়ছে। গ্রামবাসীরা আমাদের কাছে স্পষ্ট নির্দেশ চাইছেন। আমরা কি আনুষ্ঠানিক সতর্কতা জারি করব?
      rescue_worker: ডিপোতে আমাদের দুটি মোটরচালিত উদ্ধার নৌকা আর তিনটি পরিবহন ট্রাক তৈরি। বালির বস্তাও প্রস্তুত।
      family_member: আমার বাবা-মা চলাফেরা করতে পারেন না। অনুগ্রহ করে কজওয়ে ডোবার আগে আমাদের বয়স্কদের জন্য গাড়ি পাঠান।
      health_worker: মানুষ বেশিদিন আশ্রয়কেন্দ্রে থাকলে আমাদের পানীয় জল আর ওষুধের কথা ভাবতে হবে।
      district_official: জেলা নৌকা, ট্রাক আর ত্রাণ নিয়ে কনভয় পাঠাতে পারে, কিন্তু পৌঁছাতে সময় লাগে।
rulecards:
  RC-01:
    title: আগাম প্রকাশ্য সতর্কতা
    category: সতর্কতা
    guidance: নদীর পূর্বাভাস পাড় ছাপানোর ইঙ্গিত দিলে সঙ্গে সঙ্গে সরকারি সরিয়ে নেওয়ার নির্দেশ জারি করুন। আগাম সতর্কতায় দুর্বল পরিবারগুলো জরুরি জিনিস গুছিয়ে উঁচু জায়গায় যাওয়ার সময় পায়।
  RC-02:
    title: সবচেয়ে দুর্বল মানুষদের সাহায্য
    category: সরিয়ে নেওয়া
    guidance: রাস্তা ডোবার আগে বয়স্ক, ছোট শিশু, গর্ভবতী মহিলা ও চলাফেরায় অক্ষম মানুষদের জন্য বিশেষ যানবাহন ও সহায়তাকে অগ্রাধিকার দিন।
  RC-03:
    title: বন্যার জলে যানবাহনের নিরাপত্তা
    category: পরিবহন
    guidance: হাঁটুর চেয়ে গভীর বহমান জলের রাস্তায় সাধারণ যানবাহন পাঠাবেন না। রাস্তা ডুবলে নৌকা বা উঁচু বিশেষ যান ব্যবহার করুন।
  RC-04:
    title: বাঁধে বালির বস্তা বসানোর সঠিক পদ্ধতি
    category: পরিকাঠামো
    guidance: বন্যার চূড়ার আগে নিচু বাঁধে বালির বস্তা বসান। আগে বাঁধ মজবুত করলে ফাটল ধীর হয় এবং সরিয়ে নেওয়ার জন্য মূল্যবান ঘণ্টা পাওয়া যায়।
  RC-05:
    title: নিরাপদ আশ্রয়কেন্দ্র পরিচালনা
    category: আশ্রয়
    guidance: মানুষ আসার আগে উঁচু জমিতে থাকা পাকা বহুতল সরকারি ভবনকে ত্রাণ আশ্রয় হিসেবে খুলুন, যাতে প্রবেশ সুশৃঙ্খল ও নিরাপদ হয়।
  RC-06:
    title: বন্যার পরে নিরাপদ পানীয় জল
    category: পুনর্বাসন
    guidance: বন্যার জল কুয়ো আর পাইপ দূষিত করে। পুনর্বাসনের শুরুতেই তত্ত্বাবধানে জল শোধন কেন্দ্র চালু করলে আশ্রিত ও ফেরা পরিবারগুলোর জলবাহিত রোগের ঝুঁকি কমে।
  RC-07:
    title: স্বাস্থ্য পর্যবেক্ষণ ও চিকিৎসা শিবির
    category: পুনর্বাসন
    guidance: ভিড় করা আশ্রয়কেন্দ্র ও জমে থাকা জল পেট ও চামড়ার অসুখের সম্ভাবনা বাড়ায়। আশ্রয়কেন্দ্রের কাছে চিকিৎসা শিবির রোগ ছড়ানোর আগে শনাক্ত ও চিকিৎসায় সাহায্য করে।
  RC-08:
    title: পরীক্ষার পরেই বাড়ি ফিরুন
    category: পুনর্বাসন
    guidance: এলাকা শুকনো হলে, রাস্তা খোলা থাকলে এবং প্রশাসন বাড়ির কাঠামো ও বৈদ্যুতিক ক্ষতি পরীক্ষা করলে তবেই বাসিন্দারা ফিরবেন।
  RC-09:
    title: আশ্রয়কেন্দ্রে রসদ বজায় রাখা
    category: পুনর্বাসন
    guidance: আশ্রয়কেন্দ্রের মজুত ফুরানোর আগে ত্রাণ সরবরাহের পরিকল্পনা করুন। খাবার ও প্রয়োজনীয় জিনিসের অভাব স্বাস্থ্যের ক্ষতি করে এবং ত্রাণ কাজে সম্প্রদায়ের আস্থা কমায়।
  RC-10:
    title: রাস্তা পরিষ্কার ও পরিষেবা ফেরানো
    category: পুনর্বাসন
    guidance: আগে রাস্তা থেকে ধ্বংসাবশেষ সরান যাতে মেরামত দল সাবস্টেশন ও স্বাস্থ্যকেন্দ্রে পৌঁছাতে পারে। বিদ্যুৎ ফিরলে ক্লিনিক ও জলের পাম্প আবার চলে।
  RC-11:
    title: শহরের নর্দমা পরিষ্কার রাখুন
    category: শহুরে বন্যা
    guidance: বন্ধ নর্দমা ভারী বৃষ্টিকে কয়েক মিনিটে রাস্তার বন্যায় পরিণত করে। মেঘভাঙা বৃষ্টির আগে ও সময়ে বাধা সরানো আর মানুষকে আন্ডারপাস থেকে দূরে রাখা ঝুঁকি কমায়।
  RC-12:
    title: বাঁধ থেকে জল ছাড়ার খবর পৌঁছানো
    category: সতর্কতা
    guidance: ভাটির গ্রামগুলোর বাঁধ থেকে জল ছাড়ার আগে খবর দরকার। বাঁধ কর্তৃপক্ষের সঙ্গে আগে সমন্বয় করুন; স্পষ্ট সতর্কতার সঙ্গে ধীর, পর্যায়ক্রমিক জল ছাড়া মানুষকে সরার সময় দেয়।
  RC-13:
    title: জেলে সম্প্রদায়ের ঘূর্ণিঝড় প্রস্তুতি
    category: ঘূর্ণিঝড়
    guidance: ঘূর্ণিঝড়ের সতর্কতা পাওয়া মাত্র, আঘাতের অনেক আগে, মাছ ধরার নৌকা ফেরত ডাকুন। উপকূলের পরিবারগুলোকে আগে ঘূর্ণিঝড় আশ্রয়কেন্দ্রে নিন, কারণ বাতাস বাড়লে রাস্তা আর বিদ্যুৎ বন্ধ হয়ে যায়।
  RC-14:
    title: আগে বাইরের সাহায্য চাওয়া
    category: সমন্বয়
    guidance: জেলা ও রাজ্যের দলগুলোর গ্রামে পৌঁছাতে সময় লাগে। স্থানীয় সম্পদ অপর্যাপ্ত মনে হলেই বাইরের সাহায্য চান, ফুরিয়ে যাওয়ার অপেক্ষা করবেন না।
