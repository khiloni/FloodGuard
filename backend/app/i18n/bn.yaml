  A cleared road let repair crews reach the substation.: পরিষ্কার করা রাস্তা দিয়ে মেরামত দল সাবস্টেশনে পৌঁছাতে পেরেছে।
  A delivery after the low-stock warning kept the shelter supplied.: কম মজুতের সতর্কতার পরের সরবরাহে আশ্রয়কেন্দ্রে রসদ বজায় ছিল।
  A district convoy arrived with {n1} boats, {n2} trucks, {n3} sandbags and {n4} supply units.: জেলার কনভয় {n1}টি নৌকা, {n2}টি ট্রাক, {n3}টি বালির বস্তা ও {n4} সরবরাহ ইউনিট নিয়ে পৌঁছেছে।
  A medical camp opened beside the shelter to check residents and treat illness.: বাসিন্দাদের পরীক্ষা ও রোগের চিকিৎসার জন্য আশ্রয়কেন্দ্রের পাশে চিকিৎসা শিবির খুলেছে।
  A medical camp would help them.: চিকিৎসা শিবির তাদের সাহায্য করবে।
  A medical camp would let us treat them.: চিকিৎসা শিবির থাকলে আমরা তাদের চিকিৎসা করতে পারব।
  A recall message reached {n1} fishing boats at sea.: ফিরে আসার বার্তা সমুদ্রে {n1}টি মাছ ধরার নৌকায় পৌঁছেছে।
  A relief delivery of {n1} supply units reached the shelter.: '{n1} সরবরাহ ইউনিটের ত্রাণ আশ্রয়কেন্দ্রে পৌঁছেছে।'
  A road is open now, so the crews can reach the substation and restore power.: এখন একটি রাস্তা খোলা, তাই দলগুলো সাবস্টেশনে গিয়ে বিদ্যুৎ ফেরাতে পারে।
  A slower release added less water at a time, so the river stayed lower.: ধীরে ছাড়ায় একবারে কম জল এসেছে, তাই নদী নিচু ছিল।
  A water purification point started supplying safe drinking water to the shelter and wards.: জল শোধন কেন্দ্র আশ্রয়কেন্দ্র ও ওয়ার্ডগুলোতে নিরাপদ পানীয় জল দেওয়া শুরু করেছে।
