  'Engineers surveyed {p1}: {n1} of {n2} houses damaged; the water had reached {n3} cm.': 'इंजीनियरों ने {p1} का सर्वे किया: {n2} में से {n1} घर क्षतिग्रस्त; पानी {n3} सेमी तक पहुँचा था।'
