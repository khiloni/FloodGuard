sentences:
  A cleared road let repair crews reach the substation.: साफ़ की गई सड़क से मरम्मत दल सबस्टेशन तक पहुँच सके।
  A delivery after the low-stock warning kept the shelter supplied.: कम भंडार की चेतावनी के बाद की गई आपूर्ति से आश्रय में सामान बना रहा।
  A district convoy arrived with {n1} boats, {n2} trucks, {n3} sandbags and {n4} supply units.: ज़िले का काफ़िला {n1} नावें, {n2} ट्रक, {n3} रेत की बोरियाँ और {n4} आपूर्ति इकाइयाँ लेकर पहुँचा।
  A medical camp opened beside the shelter to check residents and treat illness.: निवासियों की जाँच और बीमारी के इलाज के लिए आश्रय के पास चिकित्सा शिविर खुला।
  A medical camp would help them.: चिकित्सा शिविर से उन्हें मदद मिलेगी।
  A medical camp would let us treat them.: चिकित्सा शिविर से हम उनका इलाज कर सकेंगे।
  A recall message reached {n1} fishing boats at sea.: वापसी का संदेश समुद्र में {n1} मछली पकड़ने वाली नावों तक पहुँचा।
  A relief delivery of {n1} supply units reached the shelter.: '{n1} आपूर्ति इकाइयों की राहत खेप आश्रय पहुँची।'
  A road is open now, so the crews can reach the substation and restore power.: अब एक सड़क खुली है, इसलिए दल सबस्टेशन पहुँचकर बिजली बहाल कर सकते हैं।
  A slower release added less water at a time, so the river stayed lower.: धीमी निकासी से एक बार में कम पानी आया, इसलिए नदी नीची रही।
  A water purification point started supplying safe drinking water to the shelter and wards.: जल शुद्धिकरण केंद्र ने आश्रय और वार्डों को सुरक्षित पेयजल देना शुरू किया।
  Access road to {p1} submerged beneath {n1} cm of water.: '{p1} जाने वाली सड़क {n1} सेमी पानी में डूब गई।'
  After the flood: बाढ़ के बाद
  All our teams are deployed.: हमारी सभी टीमें तैनात हैं।
  Assigned boats and trucks moved people out of this ward.: भेजी गई नावों और ट्रकों ने लोगों को इस वार्ड से बाहर निकाला।
  Assigned {n1} motorized rescue boat(s) to {p1}.: '{p1} के लिए {n1} मोटर बचाव नाव(ें) भेजी गईं।'
  Before the flood: बाढ़ से पहले
  Blocked drains overflowed in {p1}; streets are filling with water.: '{p1} में बंद नालियाँ उफन गईं; गलियों में पानी भर रहा है।'
  Boats carry {n1} each from {p1}; they stay committed there.: 'हर नाव {p1} से {n1} लोगों को ले जाती है; नावें वहीं लगी रहती हैं।'
  Boats need time to reach the harbour; recalling them early keeps crews safe.: नावों को बंदरगाह पहुँचने में समय लगता है; जल्दी वापस बुलाने से दल सुरक्षित रहते हैं।
  Boats, trucks and relief arrive after {n1} ticks; it can be requested only once.: 'नावें, ट्रक और राहत {n1} टर्न बाद पहुँचते हैं; यह केवल एक बार माँगी जा सकती है।'
  Brings the health centre and water pumps back; needs one cleared road.: 'स्वास्थ्य केंद्र और पानी के पंप फिर चालू होते हैं; एक साफ़ सड़क चाहिए।'
  'CASUALTIES REPORTED: Severe flooding ({n1} cm) stranded residents in {p1}! {n2} casualties reported.': 'हताहतों की सूचना: भीषण बाढ़ ({n1} सेमी) में {p1} के निवासी फँस गए! {n2} लोग हताहत हुए।'
  'CRITICAL BREACH: Embankment barrier collapsed under intense hydraulic pressure!': 'गंभीर दरार: पानी के भारी दबाव से तटबंध टूट गया!'
  Check the After-Action Report.: कार्य-पश्चात रिपोर्ट देखें।
  'Civil authorities activated evacuation protocols: Mandatory evacuation ordered for {p1}.': 'प्रशासन ने निकासी प्रक्रिया शुरू की: {p1} के लिए अनिवार्य निकासी का आदेश दिया गया।'
  Clean water is already being provided.: साफ़ पानी पहले से दिया जा रहा है।
  Clean water removed the main source of illness.: साफ़ पानी से बीमारी का मुख्य स्रोत हट गया।
  Clear at least one road first.: पहले कम से कम एक सड़क साफ़ करें।
  Clear drains let rainwater run off instead of filling the streets.: साफ़ नालियों से बारिश का पानी गलियों में भरने के बजाय बह गया।
  Clear it first.: पहले इसे साफ़ करें।
  Consultation held with character '{p1}'.: '{p1} से बातचीत हुई।'
  Could not determine action from '{q1}'.: '"{q1}" से कौन-सा आदेश है, यह समझ नहीं आया।'
  Crews cleared debris from the road to {p1}.: '{p1} जाने वाली सड़क से दलों ने मलबा हटाया।'
  Crews laid {n1} sandbags.: दलों ने {n1} रेत की बोरियाँ लगाईं।
  Crews still at sea when the cyclone hits cannot be reached.: चक्रवात आने पर समुद्र में मौजूद दलों तक पहुँचा नहीं जा सकता।
  'Damage survey: Engineers surveyed {p1}: {n1} of {n2} houses damaged; the water had reached {n3} cm.': 'नुकसान सर्वे: इंजीनियरों ने {p1} का सर्वे किया: {n2} में से {n1} घर क्षतिग्रस्त; पानी {n3} सेमी तक पहुँचा था।'
  Debris blocks the road to {p1}.: '{p1} जाने वाली सड़क मलबे से बंद है।'
  'Defensive engineering: Crews laid {n1} sandbags.': 'सुरक्षा कार्य: दलों ने {n1} रेत की बोरियाँ लगाईं।'
  Depth reached {n1} cm.: गहराई {n1} सेमी तक पहुँची।
  Disease risk is down to {n1}.: बीमारी का ख़तरा घटकर {n1} रह गया है।
  Disease risk is {n1} out of {n2} and rises each tick without clean water.: बीमारी का ख़तरा {n2} में से {n1} है और साफ़ पानी के बिना हर टर्न बढ़ता है।
  Disease risk is {n1} out of {n2}; clean water comes first.: 'बीमारी का ख़तरा {n2} में से {n1} है; पहले साफ़ पानी ज़रूरी है।'
  Disease risk started to fall.: बीमारी का ख़तरा घटने लगा।
  Disease risk stayed below the high mark (peak {n1}).: बीमारी का ख़तरा ऊँचे स्तर से नीचे रहा (अधिकतम {n1})।
  Dispatched {n1} transport truck(s) to {p1}.: '{p1} के लिए {n1} परिवहन ट्रक भेजे गए।'
