sentences:
  A cleared road let repair crews reach the substation.: मोकळ्या केलेल्या रस्त्यामुळे दुरुस्ती पथके उपकेंद्रापर्यंत पोहोचू शकली.
  A delivery after the low-stock warning kept the shelter supplied.: कमी साठ्याच्या इशाऱ्यानंतरच्या पुरवठ्यामुळे निवाऱ्यात सामान टिकून राहिले.
  A district convoy arrived with {n1} boats, {n2} trucks, {n3} sandbags and {n4} supply units.: जिल्ह्याचा ताफा {n1} बोटी, {n2} ट्रक, {n3} वाळूच्या पिशव्या आणि {n4} पुरवठा एकके घेऊन आला.
  A medical camp opened beside the shelter to check residents and treat illness.: रहिवाशांची तपासणी आणि आजारांवर उपचारासाठी निवाऱ्याशेजारी वैद्यकीय शिबिर सुरू झाले.
  A medical camp would help them.: वैद्यकीय शिबिरामुळे त्यांना मदत होईल.
  A medical camp would let us treat them.: वैद्यकीय शिबिरामुळे आपण त्यांच्यावर उपचार करू शकू.
  A recall message reached {n1} fishing boats at sea.: परत येण्याचा संदेश समुद्रातील {n1} मासेमारी बोटींपर्यंत पोहोचला.
  A relief delivery of {n1} supply units reached the shelter.: '{n1} पुरवठा एककांची मदत निवाऱ्यात पोहोचली.'
  A road is open now, so the crews can reach the substation and restore power.: आता एक रस्ता मोकळा आहे, त्यामुळे पथके उपकेंद्रात जाऊन वीज सुरू करू शकतात.
  A slower release added less water at a time, so the river stayed lower.: हळू सोडल्यामुळे एकावेळी कमी पाणी आले, म्हणून नदी कमी उंचीवर राहिली.
  A water purification point started supplying safe drinking water to the shelter and wards.: जलशुद्धीकरण केंद्राने निवारा आणि प्रभागांना सुरक्षित पिण्याचे पाणी देणे सुरू केले.
  Access road to {p1} submerged beneath {n1} cm of water.: '{p1} कडे जाणारा रस्ता {n1} सेमी पाण्याखाली गेला.'
  After the flood: पुरानंतर
  All our teams are deployed.: आमची सर्व पथके कामावर आहेत.
  Assigned boats and trucks moved people out of this ward.: पाठवलेल्या बोटी आणि ट्रकनी लोकांना या प्रभागातून बाहेर काढले.
  Assigned {n1} motorized rescue boat(s) to {p1}.: '{p1} साठी {n1} मोटर बचाव बोट पाठवल्या.'
  Before the flood: पुरापूर्वी
  Blocked drains overflowed in {p1}; streets are filling with water.: '{p1} मध्ये तुंबलेली गटारे ओसंडली; रस्त्यांवर पाणी साचत आहे.'
  Boats carry {n1} each from {p1}; they stay committed there.: प्रत्येक बोट {p1} मधून {n1} लोकांना नेते; बोटी तिथेच गुंतून राहतात.
  Boats need time to reach the harbour; recalling them early keeps crews safe.: बोटींना बंदरात पोहोचायला वेळ लागतो; लवकर परत बोलावल्याने पथके सुरक्षित राहतात.
  Boats, trucks and relief arrive after {n1} ticks; it can be requested only once.: बोटी, ट्रक आणि मदत {n1} फेऱ्यांनंतर येतात; ही मदत फक्त एकदाच मागता येते.
  Brings the health centre and water pumps back; needs one cleared road.: आरोग्य केंद्र आणि पाण्याचे पंप पुन्हा सुरू होतात; एक मोकळा रस्ता हवा.
  'CASUALTIES REPORTED: Severe flooding ({n1} cm) stranded residents in {p1}! {n2} casualties reported.': 'जीवितहानीचा अहवाल: भीषण पुरात ({n1} सेमी) {p1} मधील रहिवासी अडकले! {n2} जणांची जीवितहानी.'
  'CRITICAL BREACH: Embankment barrier collapsed under intense hydraulic pressure!': 'गंभीर भगदाड: पाण्याच्या प्रचंड दाबाने बंधारा फुटला!'
  Check the After-Action Report.: कार्योत्तर अहवाल पहा.
  'Civil authorities activated evacuation protocols: Mandatory evacuation ordered for {p1}.': 'प्रशासनाने स्थलांतर प्रक्रिया सुरू केली: {p1} साठी सक्तीच्या स्थलांतराचा आदेश दिला.'
  Clean water is already being provided.: स्वच्छ पाणी आधीच दिले जात आहे.
  Clean water removed the main source of illness.: स्वच्छ पाण्यामुळे आजाराचे मुख्य कारण दूर झाले.
  Clear at least one road first.: आधी किमान एक रस्ता मोकळा करा.
  Clear drains let rainwater run off instead of filling the streets.: मोकळ्या गटारांमुळे पावसाचे पाणी रस्त्यांवर साचण्याऐवजी वाहून गेले.
  Clear it first.: आधी तो मोकळा करा.
  Consultation held with character '{p1}'.: '{p1} यांच्याशी चर्चा झाली.'
  Could not determine action from '{q1}'.: '''{q1}'' यावरून कोणता आदेश आहे ते समजले नाही.'
  Crews cleared debris from the road to {p1}.: पथकांनी {p1} कडे जाणाऱ्या रस्त्यावरचा राडारोडा हटवला.
  Crews laid {n1} sandbags.: पथकांनी {n1} वाळूच्या पिशव्या लावल्या.
  Crews still at sea when the cyclone hits cannot be reached.: चक्रीवादळ धडकल्यावर समुद्रातील पथकांपर्यंत पोहोचता येत नाही.
  'Damage survey: Engineers surveyed {p1}: {n1} of {n2} houses damaged; the water had reached {n3} cm.': 'नुकसान सर्वेक्षण: अभियंत्यांनी {p1} चे सर्वेक्षण केले: {n2} पैकी {n1} घरांचे नुकसान; पाणी {n3} सेमीपर्यंत पोहोचले होते.'
  Debris blocks the road to {p1}.: '{p1} कडे जाणारा रस्ता राडारोड्याने बंद आहे.'
  'Defensive engineering: Crews laid {n1} sandbags.': 'संरक्षण काम: पथकांनी {n1} वाळूच्या पिशव्या लावल्या.'
