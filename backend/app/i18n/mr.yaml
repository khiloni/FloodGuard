  Embankment height raised to {n1} cm (integrity {n2}%).: बंधाऱ्याची उंची {n1} सेमी केली (मजबुती {n2}%).
  'Engineers surveyed {p1}: {n1} of {n2} houses damaged; the water had reached {n3} cm.': 'अभियंत्यांनी {p1} चे सर्वेक्षण केले: {n2} पैकी {n1} घरांचे नुकसान; पाणी {n3} सेमीपर्यंत पोहोचले होते.'
  Evacuated {n1} residents from {p1} to safety.: '{p1} मधून {n1} रहिवाशांना सुरक्षित स्थळी हलवले.'
  'Evacuation progress: Evacuated {n1} residents from {p1} to safety.': 'स्थलांतराची प्रगती: {p1} मधून {n1} रहिवाशांना सुरक्षित स्थळी हलवले.'
  'FLOOD WARNING: Water breached into {p1}.': 'पूर इशारा: पाणी {p1} मध्ये शिरले.'
  Families are still stranded in {p1}.: '{p1} मध्ये कुटुंबे अजूनही अडकली आहेत.'
  Families from {p1} cannot return until houses are checked.: घरांची तपासणी होईपर्यंत {p1} मधील कुटुंबे परत येऊ शकत नाहीत.
  'Final Community Resilience Score: {n1}/{n2}.': 'अंतिम समुदाय लवचिकता गुण: {n1}/{n2}.'
  'Final Outcome: Simulation ended.': 'अंतिम निकाल: सिम्युलेशन संपले.'
  Flood depth above the road cut-off blocks trucks.: रस्त्याच्या मर्यादेपेक्षा जास्त पुराचे पाणी ट्रक थांबवते.
  Floodwater has drained from {p1}.: '{p1} मधून पुराचे पाणी ओसरले आहे.'
  Floodwaters overtopped embankment crest by {n1} cm!: पुराचे पाणी बंधाऱ्याच्या माथ्यावरून {n1} सेमी वाहिले!
  Gives {n1} places; nobody can be evacuated until a shelter is open.: '{n1} जागा मिळतात; निवारा उघडेपर्यंत कोणालाही हलवता येत नाही.'
  'HAZARD: Floodwaters overtopped embankment crest by {n1} cm!': 'धोका: पुराचे पाणी बंधाऱ्याच्या माथ्यावरून {n1} सेमी वाहिले!'
  'Health alert: Waterborne disease risk rose to {n1} out of {n2}.': 'आरोग्य इशारा: जलजन्य आजाराचा धोका {n2} पैकी {n1} पर्यंत वाढला.'
  'Health alert: {n1} residents reported stomach illness linked to unsafe water.': 'आरोग्य इशारा: {n1} रहिवाशांना असुरक्षित पाण्यामुळे पोटाचा आजार झाला.'
  Health checks at the camp stopped illness from taking hold.: शिबिरातील आरोग्य तपासणीमुळे आजार पसरला नाही.
  High disease risk with no medical camp led to reported illness.: वैद्यकीय शिबिर नसल्याने आणि आजाराचा धोका जास्त असल्याने लोक आजारी पडले.
  Houses were checked before families moved back.: कुटुंबे परत येण्यापूर्वी घरांची तपासणी झाली.
  'Hydrology monitor: the river is at {n1} cm.': 'जलपातळी निरीक्षण: नदी {n1} सेमीवर आहे.'
  I can send a convoy with boats, trucks and relief.: मी बोटी, ट्रक आणि मदतीसह ताफा पाठवू शकते.
  Insufficient boats available.: पुरेशा बोटी उपलब्ध नाहीत.
  Insufficient sandbags.: पुरेशा वाळूच्या पिशव्या नाहीत.
  Insufficient vehicles available.: पुरेशी वाहने उपलब्ध नाहीत.
  Integrity down to {n1}%.: मजबुती कमी होऊन {n1}% झाली.
  It takes {n1} ticks to arrive, so ask early.: पोहोचायला {n1} फेऱ्या लागतात, म्हणून लवकर मागा.
  Keep the water point and the camp running.: पाणी केंद्र आणि शिबिर सुरू ठेवा.
  Less street water collected in {p1}.: '{p1} मध्ये रस्त्यांवर कमी पाणी साचले.'
  'Logistics update: Assigned {n1} motorized rescue boat(s) to {p1}.': 'साधनसामग्री अद्यतन: {p1} साठी {n1} मोटर बचाव बोट पाठवल्या.'
  'Logistics update: Dispatched {n1} transport truck(s) to {p1}.': 'साधनसामग्री अद्यतन: {p1} साठी {n1} वाहतूक ट्रक पाठवले.'
  Lowers the extra water from the release at tick {n1} but keeps the river high for longer.: फेरी {n1} मधील विसर्गाचे जादा पाणी कमी होते, पण नदी जास्त वेळ उंच राहते.
  Mandatory evacuation ordered for {p1}.: '{p1} साठी सक्तीच्या स्थलांतराचा आदेश दिला.'
  Municipal crews cleared blocked drains in {p1}.: नगरपालिकेच्या पथकांनी {p1} मधील तुंबलेली गटारे साफ केली.
  'New phase: The river fell to {n1} cm after the peak.': 'नवा टप्पा: शिखरानंतर नदी {n1} सेमीपर्यंत उतरली.'
  'New phase: The river reached {n1} cm and water is entering homes.': 'नवा टप्पा: नदी {n1} सेमीपर्यंत पोहोचली आणि पाणी घरांत शिरत आहे.'
  No boats are left in reserve.: राखीव बोटी शिल्लक नाहीत.
  No boats were assigned to {p1} while water there was {n1} cm or deeper.: '{p1} मध्ये पाणी {n1} सेमी किंवा अधिक खोल होते, तरी तिथे एकही बोट पाठवली नाही.'
  No new illness was reported while the camp was running.: शिबिर सुरू असताना कोणताही नवा आजार नोंदवला गेला नाही.
  No open shelter has space for rescued residents.: वाचवलेल्या रहिवाशांसाठी कोणत्याही उघड्या निवाऱ्यात जागा नाही.
  No residents from {p1} are waiting in the shelter.: '{p1} मधील कोणीही रहिवासी निवाऱ्यात वाट पाहत नाही.'
  No shelter is open to receive supplies.: पुरवठा घेण्यासाठी कोणताही निवारा उघडा नाही.
  No stranded residents remain in {p1}.: '{p1} मध्ये कोणीही अडकलेला रहिवासी उरलेला नाही.'
  No supply deliveries are left in reserve.: राखीव पुरवठा शिल्लक नाही.
  No vehicles are left in reserve.: राखीव वाहने शिल्लक नाहीत.
  Once the water is shallow my crews can clear it.: पाणी उथळ होताच माझी पथके तो मोकळा करतील.
  Open the shelter first.: आधी निवारा उघडा.
  Opens {p1} for repair crews and for residents going home.: '{p1} दुरुस्ती पथकांसाठी आणि घरी परतणाऱ्या रहिवाशांसाठी खुला होतो.'
  Outside help takes time; asking early means it arrives while it is still useful.: बाहेरच्या मदतीला वेळ लागतो; लवकर मागितल्यास ती उपयोगी असतानाच पोहोचते.
  People in the shelter are worried about the drinking water.: निवाऱ्यातील लोक पिण्याच्या पाण्याबद्दल काळजीत आहेत.
  'Please choose one of the available operations:': 'कृपया उपलब्ध कामांपैकी एक निवडा:'
  Please order an evacuation before the water rises further.: कृपया पाणी आणखी वाढण्यापूर्वी स्थलांतराचा आदेश द्या.
  Please send help for them first.: कृपया आधी त्यांच्यासाठी मदत पाठवा.
  Power is already on.: वीज आधीच सुरू आहे.
  'Priority evacuation: {n1} vulnerable individuals from {p1} reached secure shelter.': 'प्राधान्य स्थलांतर: {p1} मधील {n1} दुर्बल व्यक्ती सुरक्षित निवाऱ्यात पोहोचल्या.'
  Providing clean water early kept illness from spreading.: लवकर स्वच्छ पाणी दिल्याने आजार पसरला नाही.
  Public flood warning broadcast to all community zones.: सर्व भागांत पुराचा सार्वजनिक इशारा प्रसारित केला.
  'Public health: A medical camp opened beside the shelter to check residents and treat illness.': 'सार्वजनिक आरोग्य: रहिवाशांची तपासणी आणि उपचारासाठी निवाऱ्याशेजारी वैद्यकीय शिबिर सुरू झाले.'
  'Public health: A water purification point started supplying safe drinking water to the shelter and wards.': 'सार्वजनिक आरोग्य: जलशुद्धीकरण केंद्राने निवारा आणि प्रभागांना सुरक्षित पिण्याचे पाणी देणे सुरू केले.'
  Raises the bund by about {n1} cm (forecast peak {n2} cm); {n3} sandbags in stock.: बंधारा सुमारे {n1} सेमी उंच होतो (अंदाजित शिखर {n2} सेमी); साठ्यात {n3} वाळूच्या पिशव्या.
  Recovery actions become available once the floodwater recedes below the danger level after the peak.: शिखरानंतर पाणी धोक्याच्या पातळीखाली आल्यावरच पुनर्वसन कामे उपलब्ध होतात.
  'Recovery: Floodwater has drained from {p1}.': 'पुनर्वसन: {p1} मधून पुराचे पाणी ओसरले आहे.'
  Reduces street water in {p1}; {n1} crew(s) left.: '{p1} मधील रस्त्यांवरचे पाणी कमी होते; {n1} पथक शिल्लक.'
  'Relief infrastructure online: Shelter ''{p1}'' officially opened with intake capacity of {n1}.': 'मदत व्यवस्था सुरू: निवारा ''{p1}'' {n1} लोकांच्या क्षमतेसह उघडला.'
  'Relief logistics: A relief delivery of {n1} supply units reached the shelter.': 'मदत साधनसामग्री: {n1} पुरवठा एककांची मदत निवाऱ्यात पोहोचली.'
  Repair crews cannot reach the substation yet.: दुरुस्ती पथके अजून उपकेंद्रापर्यंत पोहोचू शकत नाहीत.
  Repair crews restored electricity from the substation.: दुरुस्ती पथकांनी उपकेंद्रातून वीज सुरू केली.
  'Repairs: Crews cleared debris from the road to {p1}.': 'दुरुस्ती: पथकांनी {p1} कडे जाणाऱ्या रस्त्यावरचा राडारोडा हटवला.'
  'Repairs: Repair crews restored electricity from the substation.': 'दुरुस्ती: दुरुस्ती पथकांनी उपकेंद्रातून वीज सुरू केली.'
  'Repairs: With power back, the village health centre reopened.': 'दुरुस्ती: वीज परत आल्यावर गावचे आरोग्य केंद्र पुन्हा सुरू झाले.'
  Requested {n1}, available {n2}.: मागितले {n1}, उपलब्ध {n2}.
  Rescue priority activated for vulnerable residents in {p1}.: '{p1} मधील दुर्बल रहिवाशांसाठी बचाव प्राधान्य सुरू केले.'
  Residents left in deep water without boats were at risk.: बोटीशिवाय खोल पाण्यात राहिलेले रहिवासी धोक्यात होते.
  'Returning home: {n1} residents of {p1} returned home from the shelter.': 'घरवापसी: {p1} मधील {n1} रहिवासी निवाऱ्यातून घरी परतले.'
  River water level reached {n1} cm.: नदीची पाणीपातळी {n1} सेमीपर्यंत पोहोचली.
  Road to {p1} is submerged.: '{p1} कडे जाणारा रस्ता पाण्याखाली आहे.'
  Roads and power are in order.: रस्ते आणि वीज व्यवस्थित आहेत.
  Roads into low areas are dangerous now.: सखल भागांकडे जाणारे रस्ते आता धोकादायक आहेत.
  Running out of supplies during the flood lowered community trust going into recovery.: पुरादरम्यान पुरवठा संपल्यामुळे पुनर्वसनाच्या वेळी समाजाचा विश्वास कमी झाला.
  Sandbags cannot contain this flood volume.: वाळूच्या पिशव्या एवढे पाणी अडवू शकत नाहीत.
  Sandbags laid before the peak raised the bund and kept it from collapsing.: शिखरापूर्वी लावलेल्या पिशव्यांनी बंधारा उंच केला आणि फुटण्यापासून वाचवला.
  'Search and rescue: Search teams rescued {n1} stranded residents from {p1} and brought them to the shelter.': 'शोध व बचाव: पथकांनी {p1} मधून {n1} अडकलेल्या रहिवाशांना वाचवून निवाऱ्यात आणले.'
  Search teams reached people the evacuation had missed.: शोध पथके स्थलांतरात राहून गेलेल्या लोकांपर्यंत पोहोचली.
  Search teams rescued {n1} stranded residents from {p1} and brought them to the shelter.: शोध पथकांनी {p1} मधून {n1} अडकलेल्या रहिवाशांना वाचवून निवाऱ्यात आणले.
  Send search and rescue teams before anything else.: सर्वात आधी शोध व बचाव पथके पाठवा.
  Send them to {p1}, where trucks can no longer get through.: त्यांना {p1} येथे पाठवा, जिथे आता ट्रक जाऊ शकत नाहीत.
  Severe flooding ({n1} cm) stranded residents in {p1}! {n2} casualties reported.: भीषण पुरात ({n1} सेमी) {p1} मधील रहिवासी अडकले! {n2} जणांची जीवितहानी.
  Shelter '{p1}' is already open and receiving evacuees.: निवारा '{p1}' आधीच उघडा आहे आणि लोकांना दाखल करून घेत आहे.
  Shelter '{p1}' officially opened with intake capacity of {n1}.: निवारा '{p1}' {n1} लोकांच्या क्षमतेसह उघडला.
  'Shelter notice: Shelter supplies are running low: {n1} units left.': 'निवारा सूचना: निवाऱ्यातील पुरवठा कमी होत आहे: {n1} एकके शिल्लक.'
  'Shelter notice: The shelter ran out of food and essentials for its {n1} residents.': 'निवारा सूचना: निवाऱ्यातील {n1} लोकांसाठी अन्न आणि आवश्यक वस्तू संपल्या.'
  Shelter stock is {n1} units for {n2} people; {n3} deliveries left.: निवाऱ्यात {n2} लोकांसाठी {n1} एकके आहेत; {n3} खेपा शिल्लक.
  'Shelter supplies are running low: {n1} units left.': 'निवाऱ्यातील पुरवठा कमी होत आहे: {n1} एकके शिल्लक.'
  Simulation ended.: सिम्युलेशन संपले.
  Simulation finished.: सिम्युलेशन पूर्ण झाले.
  Sirens and loudspeaker broadcasts echoed across the riverbank.: नदीकाठी सायरन आणि ध्वनिक्षेपकांच्या घोषणा घुमल्या.
  Some neighbours have stomach illness.: काही शेजाऱ्यांना पोटाचा आजार आहे.
  Standing floodwater set the starting disease risk to {n1} out of {n2}.: साचलेल्या पुराच्या पाण्यामुळे आजाराचा सुरुवातीचा धोका {n2} पैकी {n1} झाला.
  Status quo maintained; observation period elapsed.: परिस्थिती जैसे थे; निरीक्षणाचा वेळ गेला.
  Stock is now {n1} units.: साठा आता {n1} एकके आहे.
  Strong winds cut power across the village.: जोरदार वाऱ्यामुळे संपूर्ण गावाची वीज गेली.
  Support is already on its way and should arrive at tick {n1}.: मदत वाटेत आहे आणि फेरी {n1} ला पोहोचायला हवी.
  Survey {p1} before anyone returns.: कोणी परतण्यापूर्वी {p1} चे सर्वेक्षण करा.
  That order does not apply in this scenario.: हा आदेश या कथेत लागू होत नाही.
  The breach flooded more homes and left the village without power when recovery began.: भगदाडामुळे आणखी घरे बुडाली आणि पुनर्वसन सुरू झाले तेव्हा गावात वीज नव्हती.
  The clean water point is helping.: स्वच्छ पाणी केंद्राची मदत होत आहे.
  The convoy had not arrived when the story ended.: कथा संपेपर्यंत ताफा पोहोचला नव्हता.
  The convoy is on its way and should arrive at tick {n1}.: ताफा वाटेत आहे आणि फेरी {n1} ला पोहोचायला हवा.
  The cyclone made landfall.: चक्रीवादळ किनाऱ्यावर धडकले.
  The dam authority agreed to release water more slowly over a longer period.: धरण प्राधिकरणाने जास्त कालावधीत हळूहळू पाणी सोडण्यास संमती दिली.
  The dam authority announced a water release starting at tick {n1}.: धरण प्राधिकरणाने फेरी {n1} पासून पाणी सोडण्याची घोषणा केली.
  The dam release began, adding {n1} cm to the river.: धरणातून पाणी सोडणे सुरू झाले, नदी {n1} सेमी वाढली.
  The disease risk is {n1} out of {n2}.: आजाराचा धोका {n2} पैकी {n1} आहे.
  The district has no more support to send.: जिल्ह्याकडे पाठवण्यासाठी आणखी मदत नाही.
  The district promised outside help; it should arrive in {n1} ticks.: जिल्ह्याने बाहेरच्या मदतीचे आश्वासन दिले; ती {n1} फेऱ्यांत पोहोचायला हवी.
  The early warning made residents more willing to leave when transport arrived.: लवकर दिलेल्या इशाऱ्यामुळे वाहने आल्यावर लोक जायला अधिक तयार होते.
  The elderly people here cannot walk through it.: इथले वृद्ध त्यातून चालत जाऊ शकत नाहीत.
  The embankment held (integrity {n1}%).: बंधारा टिकून राहिला (मजबुती {n1}%).
  The fishing boats have already been recalled.: मासेमारी बोटी आधीच परत बोलावल्या आहेत.
  The fishing boats were not recalled before landfall.: चक्रीवादळ धडकण्यापूर्वी बोटी परत बोलावल्या गेल्या नाहीत.
  The flood phase has begun.: पुराचा टप्पा सुरू झाला आहे.
  The flood response phase is over; the water is receding.: पूर मदतकार्याचा टप्पा संपला; पाणी ओसरत आहे.
  The full release arrived at once on top of a river that was already high.: आधीच उंच असलेल्या नदीवर सगळे पाणी एकदम आले.
  The medical camp is already running.: वैद्यकीय शिबिर आधीच सुरू आहे.
  The medical camp treated cases before they spread.: वैद्यकीय शिबिराने आजार पसरण्यापूर्वी उपचार केले.
  The medical camp treated {n1} residents.: वैद्यकीय शिबिराने {n1} रहिवाशांवर उपचार केले.
  The recovery phase has begun; power is out and roads are blocked by debris.: पुनर्वसन टप्पा सुरू झाला; वीज नाही आणि रस्ते राडारोड्याने बंद आहेत.
  The river fell to {n1} cm after the peak.: शिखरानंतर नदी {n1} सेमीपर्यंत उतरली.
  The river reached {n1} cm and water is entering homes.: नदी {n1} सेमीपर्यंत पोहोचली आणि पाणी घरांत शिरत आहे.
  The road to {p1} is blocked by debris.: '{p1} कडे जाणारा रस्ता राडारोड्याने बंद आहे.'
  The road to {p1} is not blocked.: '{p1} कडे जाणारा रस्ता बंद नाही.'
  The road to {p1} is still under {n1} cm of water.: '{p1} कडे जाणारा रस्ता अजूनही {n1} सेमी पाण्याखाली आहे.'
  The shelter ran out of food and essentials for its {n1} residents.: निवाऱ्यातील {n1} लोकांसाठी अन्न आणि आवश्यक वस्तू संपल्या.
  The water is already at {n1} cm and families in {p1} are exposed.: पाणी आधीच {n1} सेमीवर आहे आणि {p1} मधील कुटुंबे धोक्यात आहेत.
  The water is still climbing.: पाणी अजूनही वाढत आहे.
  They should be moved early, before roads close.: रस्ते बंद होण्यापूर्वी त्यांना लवकर हलवले पाहिजे.
  This simulation session has already completed.: हे सिम्युलेशन आधीच पूर्ण झाले आहे.
  'URGENT: Access road to {p1} submerged beneath {n1} cm of water.': 'तातडीचे: {p1} कडे जाणारा रस्ता {n1} सेमी पाण्याखाली गेला.'
  Uncontrolled inundation.: अनियंत्रित जलप्रलय.
  Use recovery actions such as search and rescue, clean water or clearing roads.: शोध व बचाव, स्वच्छ पाणी किंवा रस्ते मोकळे करणे अशी पुनर्वसन कामे करा.
  Use the resources wisely.: साधनांचा विचारपूर्वक वापर करा.
  Warned residents are far more willing to leave; it uses this turn only.: इशारा मिळालेले लोक जायला अधिक तयार असतात; यात फक्त ही फेरी खर्च होते.
  Water breached into {p1}.: पाणी {p1} मध्ये शिरले.
  Water is coming into our homes in {p1}.: '{p1} मध्ये आमच्या घरांत पाणी येत आहे.'
  Waterborne disease risk rose to {n1} out of {n2}.: जलजन्य आजाराचा धोका {n2} पैकी {n1} पर्यंत वाढला.
  We are packing our documents and waiting for instructions.: आम्ही आमची कागदपत्रे बांधत आहोत आणि सूचनांची वाट पाहत आहोत.
  We have sent everything we can.: आम्ही पाठवू शकणारे सर्व पाठवले आहे.
  We have {n1} boat(s) ready.: आमच्याकडे {n1} बोट तयार आहेत.
  We just want to go home safely when our area is ready.: आमचा भाग तयार झाल्यावर आम्हाला फक्त सुरक्षित घरी जायचे आहे.
  We must open {p1} now.: आपल्याला आत्ताच {p1} उघडावा लागेल.
  We need enough food and clean water there, and the vulnerable must be checked first.: तिथे पुरेसे अन्न आणि स्वच्छ पाणी हवे, आणि दुर्बल लोकांची आधी तपासणी व्हायला हवी.
  We need the damage figures for compensation.: नुकसानभरपाईसाठी आम्हाला नुकसानीचे आकडे हवे आहेत.
  We should lay sandbags; we have {n1} ready.: आपण वाळूच्या पिशव्या लावल्या पाहिजेत; आमच्याकडे {n1} तयार आहेत.
  We still have {n1} supply deliveries at the depot.: आगारात अजून {n1} पुरवठा खेपा शिल्लक आहेत.
  Wells and pipes are contaminated.: विहिरी आणि पाइप दूषित आहेत.
  Wheeled transport blocked.: चाकांची वाहने अडली.
  Wheeled vehicles cannot safely traverse.: चाकांची वाहने सुरक्षितपणे जाऊ शकत नाहीत.
  Wheeled vehicles could no longer reach {p1}; only boats could.: चाकांची वाहने आता {p1} पर्यंत पोहोचू शकत नव्हती; फक्त बोटी पोहोचू शकत होत्या.
  Which area's drains should be cleared?: कोणत्या भागातील गटारे साफ करायची?
  Which ward should engineers survey?: अभियंत्यांनी कोणत्या प्रभागाचे सर्वेक्षण करावे?
  Which ward should receive the mandatory evacuation order?: कोणत्या प्रभागाला सक्तीच्या स्थलांतराचा आदेश द्यायचा?
  Which ward should the search and rescue teams go to?: शोध व बचाव पथके कोणत्या प्रभागात जावीत?
  Which ward's residents should return home?: कोणत्या प्रभागातील रहिवाशांनी घरी परतावे?
  Which ward's road should be cleared?: कोणत्या प्रभागाचा रस्ता मोकळा करायचा?
  Which zone should the boat(s) be dispatched to?: बोट कोणत्या भागात पाठवायची?
  With power back, the village health centre reopened.: वीज परत आल्यावर गावचे आरोग्य केंद्र पुन्हा सुरू झाले.
  With the shelter open, evacuees had a safe place to go.: निवारा उघडा असल्याने स्थलांतरितांना जाण्यासाठी सुरक्षित जागा होती.
  Without clean water, waterborne disease risk kept rising.: स्वच्छ पाण्याशिवाय जलजन्य आजाराचा धोका वाढत राहिला.
  Zone '{p1}' has no remaining population to evacuate.: '''{p1}'' मध्ये हलवण्यासाठी कोणी उरलेले नाही.'
  Zone '{p1}' has no residents awaiting transport.: '''{p1}'' मध्ये कोणीही रहिवासी वाहनाची वाट पाहत नाही.'
  Zone '{p1}' has no vulnerable individuals awaiting evacuation.: '''{p1}'' मध्ये कोणतीही दुर्बल व्यक्ती स्थलांतराची वाट पाहत नाही.'
  '{n1} boats need about {n2} ticks to return; landfall is at tick {n3}.': '{n1} बोटींना परत यायला सुमारे {n2} फेऱ्या लागतात; चक्रीवादळ फेरी {n3} ला धडकेल.'
  '{n1} fishers were still at sea when the cyclone hit and are missing.': चक्रीवादळ धडकले तेव्हा {n1} मच्छीमार समुद्रात होते आणि बेपत्ता आहेत.
  '{n1} fishing boats reached the harbour safely.': '{n1} मासेमारी बोटी सुरक्षितपणे बंदरात पोहोचल्या.'
  '{n1} people are ill now; the camp also slows the spread of disease.': सध्या {n1} लोक आजारी आहेत; शिबिर आजाराचा प्रसारही मंद करते.
  '{n1} people are in shelters now.': सध्या {n1} लोक निवाऱ्यांत आहेत.
  '{n1} people are stranded in {p1}.': '{p1} मध्ये {n1} लोक अडकले आहेत.'
  '{n1} people from {p1} can go home, easing the crowded shelter.': '{p1} मधील {n1} लोक घरी जाऊ शकतात, त्यामुळे गर्दीच्या निवाऱ्याला दिलासा मिळेल.'
  '{n1} people have untreated illness.': '{n1} लोकांच्या आजारावर उपचार झालेले नाहीत.'
  '{n1} people in {p1}; the water is forecast to reach {n2} cm against ground at {n3} cm.': '{p1} मध्ये {n1} लोक; जमीन {n3} सेमीवर आहे आणि पाणी {n2} सेमीपर्यंत पोहोचण्याचा अंदाज आहे.'
  '{n1} residents of {p1} returned home from the shelter.': '{p1} मधील {n1} रहिवासी निवाऱ्यातून घरी परतले.'
  '{n1} residents reported stomach illness linked to unsafe water.': '{n1} रहिवाशांना असुरक्षित पाण्यामुळे पोटाचा आजार झाला.'
  '{n1} stranded residents reached the shelter.': '{n1} अडकलेले रहिवासी निवाऱ्यात पोहोचले.'
  '{n1} truck(s) are free while the roads are still open.': रस्ते उघडे असेपर्यंत {n1} ट्रक मोकळे आहेत.
  '{n1} truck(s) carry {n2} each while the road is dry; they stop once it floods.': रस्ता कोरडा असेपर्यंत {n1} ट्रक, प्रत्येकी {n2} लोकांना नेतात; पाणी साचताच ते थांबतात.
  '{n1} vulnerable individuals from {p1} reached secure shelter.': '{p1} मधील {n1} दुर्बल व्यक्ती सुरक्षित निवाऱ्यात पोहोचल्या.'
  '{n1} vulnerable residents are still at home.': '{n1} दुर्बल रहिवासी अजूनही घरी आहेत.'
  '{n1} vulnerable residents in {p1} move first; others wait a little longer.': '{p1} मधील {n1} दुर्बल रहिवासी आधी जातात; बाकीचे थोडा वेळ थांबतात.'
  '{n1} ward(s) had been flooded.': '{n1} प्रभाग बुडाले होते.'
  '{p1} has already been surveyed.': '{p1} चे सर्वेक्षण आधीच झाले आहे.'
  '{p1} is still under {n1} cm of water.': '{p1} अजूनही {n1} सेमी पाण्याखाली आहे.'
  '{p1} must have a damage survey before residents return.': रहिवासी परतण्यापूर्वी {p1} चे नुकसान सर्वेक्षण आवश्यक आहे.
  '{p1} needs clear direction.': '{p1} ला स्पष्ट सूचना हव्यात.'
  '{p1} stayed dry; its residents are safe at home and need no rescue.': '{p1} कोरडा राहिला; तिथले रहिवासी घरी सुरक्षित आहेत आणि त्यांना बचावाची गरज नाही.'
  '{p1} was not flooded; no damage survey is needed.': '{p1} मध्ये पूर आला नाही; नुकसान सर्वेक्षणाची गरज नाही.'
  '{p1}: The medical camp treated {n1} residents.': '{p1}: वैद्यकीय शिबिराने {n1} रहिवाशांवर उपचार केले.'
scenarios:
  cyclone-surge-01:
    name: माछीवाड्यात चक्रीवादळ
    hazard_label: चक्रीवादळाची सागरी लाट
    hook: चक्रीवादळ काही तासांत धडकेल, मासेमारी बोटी अजून समुद्रात आहेत आणि चक्रीवादळ निवाऱ्यात सर्वांसाठी जागा नाही.
    description: एक तीव्र चक्रीवादळ कोळी गावाकडे येत आहे. सागरी लाट समुद्राला समुद्री भिंतीवरून ढकलेल. चक्रीवादळ धडकण्यापूर्वी लोकांना हलवा, बोटी परत बोलवा आणि गर्दीचा चक्रीवादळ निवारा सांभाळा.
    npcs:
      village_head: आमच्या आठ बोटी इशाऱ्यापूर्वीच निघाल्या होत्या. त्यांची कुटुंबे किनाऱ्यावर विचारत आहेत की काय करायचे.
      rescue_worker: आम्ही रेडिओवरून मच्छीमारांशी संपर्क करू शकतो, पण त्यांना बंदरात परत यायला सुमारे दीड तास लागेल.
      family_member: माझे पती अजून समुद्रात आहेत आणि माझे सासरे अंथरुणाला खिळले आहेत. मी दोघांना सोडू शकत नाही.
      health_worker: चक्रीवादळ निवाऱ्यात खूप गर्दी होते. आपण स्वच्छ पाणी आणि वैद्यकीय शिबिराचे नियोजन करायला हवे.
      district_official: राज्य बोटी आणि मदत पाठवू शकते, पण वारा वाढताच रस्ते तुटतील.
  dam-release-01:
    name: कालिंदी धरणाच्या खाली
    hazard_label: धरणातून विसर्ग
    hook: धरणाला काही तासांत पाणी सोडावे लागेल. तुम्ही प्रत्येक गावाला वेळेत सावध करू शकाल का, आणि विसर्ग हळू करून घेऊ शकाल का?
    description: वरच्या भागात मुसळधार पावसामुळे कालिंदी धरणातून नियोजित विसर्ग करावा लागणार आहे. खालची नदी आधीच भरलेली आहे. वेळ आणि प्रत्येक गावापर्यंत संदेश पोहोचवणे हेच निकाल ठरवेल.
    npcs:
      village_head: इथली अनेक कुटुंबे नदीकाठी शेती करतात. धरण सूचना न देता उघडले तर ते शेतात अडकतील.
      rescue_worker: घाटावर आमच्या तीन बोटी आणि दोन जीप आहेत. मंदिर वस्तीकडे जाणारा सखल पूल लवकर बुडतो.
      family_member: माझी आई फार दूर चालू शकत नाही. पाणी येण्यापूर्वी कोणी आम्हाला सांगेल का?
      health_worker: कोणत्या घरांत वृद्ध आणि गर्भवती महिला आहेत हे मला माहीत आहे. त्यांना आधी हलवावे लागेल.
      district_official: धरण सुरक्षित ठेवण्यासाठी अभियंत्यांना पाणी सोडावेच लागेल. आपण लवकर सांगितले तर ते हळू सोडायला तयार होऊ शकतात.
  glacial-lake-01:
    name: त्सोमो खोऱ्यावर हिमनदी तलाव फुटणे
    hazard_label: हिमनदी तलाव फुटणे
    hook: खोऱ्याच्या वरील तलावाच्या सेन्सरने आत्ताच धोक्याची सूचना दिली. पाणी आणि दगडांचा लोंढा यायला सुमारे दोन तास आहेत.
    description: डोंगराळ खोऱ्यावरील हिमनदी तलावाचे सेन्सर सांगतात की त्याची मोरेन भिंत कोसळू शकते. तलाव फुटला तर पाणी आणि राडारोड्याची भिंत काही तासांत खोऱ्यात पोहोचेल. कमी वेळात सर्वांना वर न्या, मग खोरे पुन्हा खुले करा.
    npcs:
      village_head: दुकानदार म्हणतात नदी फक्त थोडी वाढली आहे. इशारा स्पष्ट आणि मोठ्याने दिल्याशिवाय ते बाजार बंद करणार नाहीत.
      rescue_worker: चार ट्रक, एक रबरी बोट. राडारोड्याच्या लोंढ्यात बोट निरुपयोगी आहे; रस्ता आहे तोपर्यंत ट्रकच आपला आधार आहेत.
      family_member: माझी आजी नव्वद वर्षांची आहे आणि मठाच्या पायऱ्या चढू शकत नाही. कृपया वृद्धांसाठी आधी वाहन पाठवा.
      health_worker: टेकडीवरच्या थंड रात्री बाळे आणि वृद्धांसाठी कठीण असतील. आम्हाला ब्लँकेट, स्वच्छ पाणी आणि वैद्यकीय शिबिर लागेल.
      district_official: तलावाच्या सेन्सरने धोक्याची सूचना पाठवली आहे. मोबाइल इशारा तयार आहे, पण सायरन वाजवण्याचा निर्णय तुमचा आहे.
  river-island-01:
    name: 'कमलपूर चर: नदीतील बेट'
    hazard_label: नदीतील बेटावर पूर
    hook: फुगणाऱ्या नदीत वाळूच्या बेटावर दोन वस्त्या आहेत. बेटावरून बाहेर जायला रस्ता नाही, फक्त बोटी आहेत, आणि नदी दर तासाला वाढत आहे.
    description: 'मोठ्या नदीतील पावसाळी पूर वाळूच्या बेटाला (चर) वेढत आहे. मुख्य भूमीपर्यंत रस्ता नाही: प्रत्येक वेळी पलीकडे जायला बोट लागते. बेटावरील कुटुंबांना लवकर हलवा, वेढा बंधारा टिकवून ठेवा, मग सर्वांना घरी परत आणा.'
    npcs:
      village_head: दर पावसाळ्यात नदी आमच्या बेटाचा थोडा आणखी भाग खाते. विश्वासू व्यक्तीने लवकर सांगितल्याशिवाय लोक आपली गुरे आणि माग सोडणार नाहीत.
      rescue_worker: घाटावर इंजिन असलेल्या तीन देशी बोटी बांधलेल्या आहेत. प्रत्येक वेळी पलीकडे जायला वेळ लागतो, आणि नदी वाढेल तसा प्रवाह जोरदार होतो.
      family_member: माझ्या धाकट्याला ताप आहे आणि माझ्या सासूबाई फार दूर चालू शकत नाहीत. पाणी अंगणापर्यंत आले तर आम्ही अडकू.
      health_worker: पाणी ओसरल्यावर लोक बुडालेल्या हातपंपांचे पाणी पितात. आम्हाला क्लोरीनच्या गोळ्या आणि चौथऱ्यावर वैद्यकीय शिबिर हवे.
      district_official: जिल्हा आणखी बोटी आणि मदत पाठवू शकतो, पण ती आधी रस्त्याने घाटापर्यंत आणि मग पाण्यातून येते.
  urban-flash-flood-01:
    name: प्रभाग 14 मधील अचानक पूर
    hazard_label: शहरी अचानक पूर
    hook: दाट शहरी प्रभागावर ढगफुटी झाली आहे. गटारे तुंबली आहेत, भुयारी मार्ग सर्वात आधी भरतो, आणि तुमच्याकडे तास नाहीत, मिनिटे आहेत.
    description: शहरातील एका प्रभागावर ढगफुटी. तुंबलेली गटारे आणि रेल्वे भुयारी मार्ग काही मिनिटांत रस्त्यांना नाल्यांमध्ये बदलतात. वेगाने काम करा, मग वीज, रस्ते आणि सुरक्षित पाणी पूर्ववत करा.
    npcs:
      village_head: बाजारामागची गटारे पुन्हा प्लास्टिकने तुंबली आहेत. पाऊस सुरू राहिला तर भुयारी मार्ग सर्वात आधी भरेल.
      rescue_worker: आमच्याकडे दोन बचाव डिंगी आणि चार ट्रक आहेत. पाणी पदपथाच्या वर आले की ट्रक भुयारी मार्गातून जाऊ शकत नाहीत.
      family_member: आमच्या गल्लीत आधीच घोट्यापर्यंत पाणी आहे आणि माझे शेजारी व्हीलचेअर वापरतात.
      health_worker: सांडपाणी मिसळलेले पुराचे पाणी गंभीर धोका आहे. नंतर आम्हाला लवकर स्वच्छ पाणी लागेल.
      district_official: राज्य आपत्ती दल बोटी पाठवू शकते, पण या प्रभागात पोहोचायला त्यांना काही तास लागतील.
  village-river-01:
    name: नदीकाठच्या गावात पूर मदतकार्य
    hazard_label: नदीचा पूर
    hook: पावसाळ्यातील एक उपनदी तीन प्रभागांजवळ वाढत आहे. इशारा द्या, लोकांना हलवा आणि बंधारा वाचवा, मग पुनर्वसनाचे नेतृत्व करा.
    description: 'वाढती उपनदी तीन प्रभागांना धोका निर्माण करत आहे. पूर शिखरावर पोहोचण्यापूर्वी इशारा द्या आणि लोकांना हलवा, पुरादरम्यान लोकांचे संरक्षण करा, मग पुनर्वसनाचे नेतृत्व करा: स्वच्छ पाणी, उपचार, वीज, रस्ते आणि सुरक्षित घरवापसी.'
    npcs:
      village_head: प्रभाग 1 जवळ पाणी झपाट्याने वाढत आहे. गावकरी आमच्याकडून स्पष्ट सूचनांची अपेक्षा करत आहेत. आपण औपचारिक इशारा द्यावा का?
      rescue_worker: आगारात आमच्या दोन मोटर बचाव बोटी आणि तीन वाहतूक ट्रक तयार आहेत. वाळूच्या पिशव्याही तयार आहेत.
      family_member: माझ्या आई-वडिलांना हालचाल करता येत नाही. कृपया पूल-रस्ता बुडण्यापूर्वी आमच्या वडीलधाऱ्यांसाठी वाहन पाठवा.
      health_worker: लोक बराच काळ निवाऱ्यात राहिले तर आपल्याला पिण्याचे पाणी आणि औषधांचा विचार करावा लागेल.
      district_official: जिल्हा बोटी, ट्रक आणि मदतीसह ताफा पाठवू शकतो, पण पोहोचायला वेळ लागतो.
rulecards:
  RC-01:
    title: लवकर सार्वजनिक इशारा
    category: इशारे
    guidance: नदीचा अंदाज काठावरून पाणी वाहण्याचे संकेत देत असेल तर लगेच अधिकृत स्थलांतर सूचना द्या. लवकर इशाऱ्यामुळे दुर्बल कुटुंबांना आपत्कालीन साहित्य गोळा करायला आणि उंच जागी जायला वेळ मिळतो.
  RC-02:
    title: सर्वात दुर्बल लोकांना मदत
    category: स्थलांतर
    guidance: रस्ते बुडण्यापूर्वी वृद्ध, लहान मुले, गर्भवती महिला आणि हालचाल करू न शकणाऱ्या लोकांसाठी विशेष वाहने आणि मदतीला प्राधान्य द्या.
  RC-03:
    title: पुराच्या पाण्यात वाहन सुरक्षा
    category: वाहतूक
    guidance: गुडघ्यापेक्षा खोल वाहत्या पाण्याच्या रस्त्यांवर साधी वाहने पाठवू नका. रस्ते बुडाल्यावर बोटी किंवा उंच विशेष वाहने वापरा.
  RC-04:
    title: बंधाऱ्यावर वाळूच्या पिशव्या लावण्याची योग्य पद्धत
    category: पायाभूत सुविधा
    guidance: पुराच्या शिखरापूर्वी सखल बंधाऱ्यांवर वाळूच्या पिशव्या लावा. बंधारा लवकर मजबूत केल्याने भगदाड मंदावते आणि स्थलांतरासाठी मोलाचे तास मिळतात.
  RC-05:
    title: सुरक्षित निवारा व्यवस्थापन
    category: निवारा
    guidance: लोक येण्यापूर्वी उंच जागी असलेल्या पक्क्या बहुमजली सार्वजनिक इमारती मदत निवारे म्हणून उघडा, जेणेकरून प्रवेश सुव्यवस्थित आणि सुरक्षित होईल.
  RC-06:
    title: पुरानंतर सुरक्षित पिण्याचे पाणी
    category: पुनर्वसन
    guidance: पुराचे पाणी विहिरी आणि पाइप दूषित करते. पुनर्वसनाच्या सुरुवातीलाच देखरेखीखालील जलशुद्धीकरण केंद्र सुरू केल्याने निवाऱ्यातील आणि परतणाऱ्या कुटुंबांमध्ये जलजन्य आजाराचा धोका कमी होतो.
  RC-07:
    title: आरोग्य देखरेख आणि वैद्यकीय शिबिरे
    category: पुनर्वसन
    guidance: गर्दीचे निवारे आणि साचलेले पाणी पोटाचे आणि त्वचेचे आजार वाढवतात. निवाऱ्याजवळील वैद्यकीय शिबिर आजार पसरण्यापूर्वी ओळखून उपचार करण्यास मदत करते.
  RC-08:
    title: तपासणीनंतरच घरी परता
    category: पुनर्वसन
    guidance: भाग कोरडा असेल, रस्ता खुला असेल आणि प्रशासनाने घरांची रचना व विजेची तपासणी केली असेल तेव्हाच रहिवाशांनी परतावे.
  RC-09:
    title: निवाऱ्यांत पुरवठा टिकवणे
    category: पुनर्वसन
    guidance: निवाऱ्यातील साठा संपण्यापूर्वी मदत पुरवठ्याचे नियोजन करा. अन्न आणि आवश्यक वस्तूंची टंचाई आरोग्य बिघडवते आणि मदतकार्यावरचा समाजाचा विश्वास कमी करते.
  RC-10:
    title: रस्ते मोकळे करणे आणि सेवा पूर्ववत करणे
    category: पुनर्वसन
    guidance: आधी रस्त्यांवरचा राडारोडा हटवा, म्हणजे दुरुस्ती पथके उपकेंद्रे आणि आरोग्य केंद्रांपर्यंत पोहोचू शकतील. वीज आल्याने दवाखाने आणि पाण्याचे पंप पुन्हा चालतात.
  RC-11:
    title: शहरी गटारे मोकळी ठेवा
    category: शहरी पूर
    guidance: तुंबलेली गटारे मुसळधार पावसाला काही मिनिटांत रस्त्यावरच्या पुरात बदलतात. ढगफुटीपूर्वी आणि दरम्यान अडथळे दूर करणे आणि लोकांना भुयारी मार्गांपासून दूर ठेवणे धोका कमी करते.
  RC-12:
    title: धरण विसर्गाची माहिती
    category: इशारे
    guidance: खालच्या गावांना धरणातून पाणी सोडण्यापूर्वी सूचना हवी. धरण प्राधिकरणाशी लवकर समन्वय साधा; स्पष्ट इशाऱ्यांसह हळू, टप्प्याटप्प्याने विसर्ग लोकांना हलायला वेळ देतो.
  RC-13:
    title: कोळी समाजाची चक्रीवादळ तयारी
    category: चक्रीवादळ
    guidance: चक्रीवादळाचा इशारा मिळताच, धडकण्याच्या खूप आधी, मासेमारी बोटी परत बोलवा. किनारपट्टीवरील कुटुंबांना लवकर चक्रीवादळ निवाऱ्यात न्या, कारण वारा वाढला की रस्ते आणि वीज बंद होतात.
  RC-14:
    title: बाहेरची मदत लवकर मागणे
    category: समन्वय
    guidance: जिल्हा आणि राज्य पथकांना गावापर्यंत पोहोचायला वेळ लागतो. स्थानिक साधने अपुरी वाटताच बाहेरची मदत मागा, ती संपण्याची वाट पाहू नका.
