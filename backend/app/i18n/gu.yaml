  Which ward's residents should return home?: કયા વોર્ડના રહેવાસીઓ ઘરે પાછા ફરે?
  Which ward's road should be cleared?: કયા વોર્ડનો રસ્તો સાફ કરવો?
  Which zone should the boat(s) be dispatched to?: હોડી કયા વિસ્તારમાં મોકલવી?
  With power back, the village health centre reopened.: વીજળી આવતાં ગામનું આરોગ્ય કેન્દ્ર ફરી ખૂલ્યું.
  With the shelter open, evacuees had a safe place to go.: આશ્રય ખુલ્લો હોવાથી સ્થળાંતરિત લોકો પાસે જવા સલામત જગ્યા હતી.
  Without clean water, waterborne disease risk kept rising.: સ્વચ્છ પાણી વિના પાણીજન્ય બીમારીનું જોખમ વધતું રહ્યું.
  Zone '{p1}' has no remaining population to evacuate.: '''{p1}''માં ખસેડવા માટે કોઈ બાકી નથી.'
  Zone '{p1}' has no residents awaiting transport.: '''{p1}''માં કોઈ રહેવાસી વાહનની રાહ જોતો નથી.'
  Zone '{p1}' has no vulnerable individuals awaiting evacuation.: '''{p1}''માં કોઈ નબળી વ્યક્તિ સ્થળાંતરની રાહ જોતી નથી.'
  '{n1} boats need about {n2} ticks to return; landfall is at tick {n3}.': '{n1} હોડીઓને પાછા ફરતાં લગભગ {n2} વારા લાગે છે; વાવાઝોડું વારા {n3} પર ટકરાશે.'
  '{n1} fishers were still at sea when the cyclone hit and are missing.': વાવાઝોડું ટકરાયું ત્યારે {n1} માછીમારો દરિયામાં હતા અને ગુમ છે.
  '{n1} fishing boats reached the harbour safely.': '{n1} માછીમારી હોડીઓ સલામત રીતે બંદરે પહોંચી.'
  '{n1} people are ill now; the camp also slows the spread of disease.': અત્યારે {n1} લોકો બીમાર છે; શિબિર બીમારીનો ફેલાવો પણ ધીમો કરે છે.
  '{n1} people are in shelters now.': અત્યારે {n1} લોકો આશ્રયોમાં છે.
  '{n1} people are stranded in {p1}.': '{p1}માં {n1} લોકો ફસાયેલા છે.'
  '{n1} people from {p1} can go home, easing the crowded shelter.': '{p1}ના {n1} લોકો ઘરે જઈ શકે છે, જેથી ભીડવાળા આશ્રયને રાહત મળશે.'
  '{n1} people have untreated illness.': '{n1} લોકોની બીમારીની સારવાર થઈ નથી.'
  '{n1} people in {p1}; the water is forecast to reach {n2} cm against ground at {n3} cm.': '{p1}માં {n1} લોકો; જમીન {n3} સેમી પર છે અને પાણી {n2} સેમી સુધી પહોંચવાનો અંદાજ છે.'
  '{n1} residents of {p1} returned home from the shelter.': '{p1}ના {n1} રહેવાસીઓ આશ્રયમાંથી ઘરે પાછા ફર્યા.'
  '{n1} residents reported stomach illness linked to unsafe water.': '{n1} રહેવાસીઓને અસુરક્ષિત પાણીથી પેટની બીમારી થઈ.'
  '{n1} stranded residents reached the shelter.': '{n1} ફસાયેલા રહેવાસીઓ આશ્રયમાં પહોંચ્યા.'
  '{n1} truck(s) are free while the roads are still open.': રસ્તા ખુલ્લા છે ત્યાં સુધી {n1} ટ્રક ખાલી છે.
  '{n1} truck(s) carry {n2} each while the road is dry; they stop once it floods.': રસ્તો સૂકો છે ત્યાં સુધી {n1} ટ્રક, દરેક {n2} લોકોને લઈ જાય છે; પાણી ભરાતાં તે અટકી જાય છે.
  '{n1} vulnerable individuals from {p1} reached secure shelter.': '{p1}ના {n1} નબળા લોકો સલામત આશ્રયમાં પહોંચ્યા.'
  '{n1} vulnerable residents are still at home.': '{n1} નબળા રહેવાસીઓ હજુ ઘરે છે.'
  '{n1} vulnerable residents in {p1} move first; others wait a little longer.': '{p1}ના {n1} નબળા રહેવાસીઓ પહેલાં જાય છે; બાકીના થોડી વધુ રાહ જુએ છે.'
  '{n1} ward(s) had been flooded.': '{n1} વોર્ડ ડૂબી ગયા હતા.'
  '{p1} has already been surveyed.': '{p1}નો સર્વે પહેલેથી થઈ ગયો છે.'
  '{p1} is still under {n1} cm of water.': '{p1} હજુ {n1} સેમી પાણીમાં છે.'
  '{p1} must have a damage survey before residents return.': રહેવાસીઓ પાછા ફરે તે પહેલાં {p1}નો નુકસાન સર્વે જરૂરી છે.
  '{p1} needs clear direction.': '{p1}ને સ્પષ્ટ સૂચના જોઈએ.'
  '{p1} stayed dry; its residents are safe at home and need no rescue.': '{p1} સૂકો રહ્યો; તેના રહેવાસીઓ ઘરે સલામત છે અને બચાવની જરૂર નથી.'
  '{p1} was not flooded; no damage survey is needed.': '{p1}માં પૂર આવ્યું નહોતું; નુકસાન સર્વેની જરૂર નથી.'
  '{p1}: The medical camp treated {n1} residents.': '{p1}: તબીબી શિબિરે {n1} રહેવાસીઓની સારવાર કરી.'
scenarios:
  cyclone-surge-01:
    name: માછીવાડામાં વાવાઝોડું
    hazard_label: વાવાઝોડાનો દરિયાઈ ઉછાળ
    hook: વાવાઝોડું થોડા કલાકોમાં ટકરાશે, માછીમારી હોડીઓ હજુ દરિયામાં છે અને વાવાઝોડા આશ્રયમાં બધા માટે જગ્યા નથી.
    description: એક તીવ્ર વાવાઝોડું માછીમારોના ગામ તરફ આવી રહ્યું છે. દરિયાઈ ઉછાળ દરિયાને દરિયાઈ દીવાલ ઉપરથી ધકેલશે. વાવાઝોડું ટકરાય તે પહેલાં લોકોને ખસેડો, હોડીઓને પાછી બોલાવો અને ભીડવાળા વાવાઝોડા આશ્રયને સંભાળો.
    npcs:
      village_head: અમારી આઠ હોડીઓ ચેતવણી પહેલાં નીકળી ગઈ હતી. તેમના પરિવારો કાંઠે પૂછી રહ્યા છે કે શું કરવું.
      rescue_worker: અમે રેડિયોથી માછીમારોનો સંપર્ક કરી શકીએ, પણ તેમને બંદરે પાછા ફરતાં લગભગ દોઢ કલાક લાગશે.
      family_member: મારા પતિ હજુ દરિયામાં છે અને મારા સસરા પથારીવશ છે. હું બંનેને છોડી શકતી નથી.
      health_worker: વાવાઝોડા આશ્રયમાં બહુ ભીડ થાય છે. આપણે સ્વચ્છ પાણી અને તબીબી શિબિરનું આયોજન કરવું જોઈએ.
      district_official: રાજ્ય હોડીઓ અને રાહત મોકલી શકે છે, પણ પવન તેજ થતાં જ રસ્તા કપાઈ જશે.
  dam-release-01:
    name: કાલિંદી બંધની નીચે
    hazard_label: બંધમાંથી પાણી છોડવું
    hook: બંધને થોડા કલાકોમાં પાણી છોડવું પડશે. શું તમે દરેક ગામને સમયસર ચેતવી શકો અને પાણી ધીમે છોડાવી શકો?
    description: ઉપરવાસમાં ભારે વરસાદને કારણે કાલિંદી બંધમાંથી નિયત પાણી છોડવું પડશે. નીચે નદી પહેલેથી ઊંચી છે. સમય અને દરેક ગામ સુધી સંદેશ પહોંચાડવો જ પરિણામ નક્કી કરશે.
    npcs:
      village_head: અહીં ઘણા પરિવારો નદીકાંઠે ખેતી કરે છે. જો બંધ સૂચના વિના ખૂલે, તો તેઓ ખેતરોમાં ફસાઈ જશે.
      rescue_worker: ઘાટ પર અમારી ત્રણ હોડીઓ અને બે જીપ છે. મંદિર વસાહત જતો નીચો પુલ ઝડપથી ડૂબી જાય છે.
      family_member: મારી માતા બહુ દૂર ચાલી શકતી નથી. પાણી આવે તે પહેલાં કોઈ અમને જણાવશે?
      health_worker: મને ખબર છે કયા ઘરોમાં વૃદ્ધો અને સગર્ભા મહિલાઓ છે. તેમને પહેલાં ખસેડવા પડશે.
      district_official: બંધ સલામત રાખવા ઇજનેરોએ પાણી છોડવું જ પડશે. જો આપણે વહેલા કહીએ તો તેઓ ધીમે છોડવા સંમત થઈ શકે.
  glacial-lake-01:
    name: ત્સોમો ખીણ ઉપર હિમનદી સરોવર ફાટવું
    hazard_label: હિમનદી સરોવર ફાટવું
    hook: ખીણ ઉપરના સરોવરના સેન્સરે હમણાં જ એલાર્મ આપ્યું છે. પાણી અને પથ્થરોનો ધસારો આવવામાં લગભગ બે કલાક છે.
    description: પહાડી ખીણ ઉપરના હિમનદી સરોવરના સેન્સર ચેતવે છે કે તેની મોરેન દીવાલ તૂટી શકે છે. જો સરોવર ફાટે, તો પાણી અને કાટમાળની દીવાલ થોડા કલાકોમાં ખીણ સુધી પહોંચશે. ટૂંકા સમયમાં બધાને ઉપર લઈ જાઓ, પછી ખીણ ફરી ખોલો.
    npcs:
      village_head: દુકાનદારો કહે છે કે નદી બસ થોડી ઊંચી છે. ચેતવણી સ્પષ્ટ અને જોરદાર ન હોય ત્યાં સુધી તેઓ બજાર બંધ નહીં કરે.
      rescue_worker: ચાર ટ્રક, એક રબરની હોડી. કાટમાળના ધસારામાં હોડી નકામી છે; રસ્તો છે ત્યાં સુધી ટ્રક જ આપણો સહારો છે.
      family_member: મારી દાદી નેવું વર્ષનાં છે અને મઠનાં પગથિયાં ચઢી શકતાં નથી. કૃપા કરીને વૃદ્ધો માટે પહેલાં વાહન મોકલો.
      health_worker: ટેકરી પરની ઠંડી રાતો બાળકો અને વૃદ્ધો માટે કઠિન હશે. અમને ધાબળા, સ્વચ્છ પાણી અને તબીબી શિબિર જોઈશે.
      district_official: સરોવરના સેન્સરે એલાર્મ મોકલ્યો છે. મોબાઇલ એલર્ટ તૈયાર છે, પણ સાયરન વગાડવાનો નિર્ણય તમારો છે.
  river-island-01:
    name: 'કમલપુર ચર: નદીમાં એક ટાપુ'
    hazard_label: નદી ટાપુનું પૂર
    hook: વધતી નદી વચ્ચે રેતીના ટાપુ પર બે વસાહતો છે. ટાપુ પરથી કોઈ રસ્તો નથી, માત્ર હોડીઓ છે, અને નદી દર કલાકે વધે છે.
    description: મોટી નદીમાં ચોમાસાનું પૂર રેતીના ટાપુ (ચર)ને ઘેરી રહ્યું છે. મુખ્ય ભૂમિ સુધી કોઈ રસ્તો નથી, દરેક વખતે પાર જવા હોડી જોઈએ. ટાપુના પરિવારોને વહેલા ખસેડો, ઘેરાવ પાળાને ટકાવી રાખો, પછી બધાને ઘરે પાછા લાવો.
    npcs:
      village_head: દર ચોમાસે નદી અમારા ટાપુનો થોડો વધુ ભાગ ખાઈ જાય છે. લોકો પોતાનાં પશુ અને સાળ ત્યારે જ છોડશે જ્યારે કોઈ ભરોસાપાત્ર વ્યક્તિ તેમને વહેલા કહે.
      rescue_worker: ઘાટ પર એન્જિનવાળી ત્રણ દેશી હોડીઓ બાંધેલી છે. દરેક વખતે પાર જવામાં સમય લાગે છે, અને નદી વધતાં પ્રવાહ તેજ થતો જાય છે.
      family_member: મારા સૌથી નાના બાળકને તાવ છે અને મારાં સાસુ બહુ દૂર ચાલી શકતાં નથી. જો પાણી આંગણા સુધી આવ્યું તો અમે ફસાઈ જઈશું.
      health_worker: પાણી ઓસર્યા પછી લોકો ડૂબેલા હેન્ડપંપમાંથી પાણી પીએ છે. અમને ક્લોરિનની ગોળીઓ અને ઓટલા પર તબીબી શિબિર જોઈએ.
      district_official: જિલ્લો વધુ હોડીઓ અને રાહત મોકલી શકે છે, પણ તે પહેલાં રસ્તાથી ઘાટ સુધી અને પછી પાણીમાંથી આવે છે.
  urban-flash-flood-01:
    name: વોર્ડ 14નું અચાનક પૂર
    hazard_label: શહેરી અચાનક પૂર
    hook: ગીચ શહેરી વોર્ડ પર વાદળ ફાટ્યું છે. ગટરો બંધ છે, અંડરપાસ સૌથી પહેલાં ભરાય છે, અને તમારી પાસે કલાકો નહીં, મિનિટો છે.
    description: શહેરના એક વોર્ડ પર વાદળ ફાટ્યું છે. બંધ ગટરો અને રેલવે અંડરપાસ થોડી જ મિનિટોમાં શેરીઓને નાળાં બનાવી દે છે. ઝડપથી કામ કરો, પછી વીજળી, રસ્તા અને સલામત પાણી પાછાં લાવો.
    npcs:
      village_head: બજાર પાછળની ગટરો ફરી પ્લાસ્ટિકથી ભરાઈ ગઈ છે. જો વરસાદ ચાલુ રહેશે, તો અંડરપાસ સૌથી પહેલાં ભરાશે.
      rescue_worker: અમારી પાસે બે બચાવ ડિંગી અને ચાર ટ્રક છે. પાણી ફૂટપાથથી ઉપર આવે પછી ટ્રક અંડરપાસમાંથી જઈ શકતી નથી.
      family_member: અમારી ગલીમાં પહેલેથી ઘૂંટી સુધી પાણી છે અને મારા પડોશી વ્હીલચેર વાપરે છે.
      health_worker: ગટરનું પાણી ભળેલું પૂરનું પાણી ગંભીર જોખમ છે. પછી અમને ઝડપથી સ્વચ્છ પાણી જોઈશે.
      district_official: રાજ્ય આપત્તિ દળ હોડીઓ મોકલી શકે છે, પણ આ વોર્ડ સુધી પહોંચતાં તેમને થોડા કલાક લાગશે.
  village-river-01:
    name: નદીકાંઠાના ગામમાં પૂર રાહત
    hazard_label: નદીનું પૂર
    hook: ચોમાસાની એક ઉપનદી ત્રણ વોર્ડ પાસે વધી રહી છે. ચેતવો, લોકોને ખસેડો અને પાળો બચાવો, પછી પુનર્વસનનું નેતૃત્વ કરો.
    description: 'વધતી ઉપનદી ત્રણ વોર્ડને જોખમમાં મૂકે છે. પૂર ટોચે પહોંચે તે પહેલાં ચેતવો અને લોકોને ખસેડો, પૂર દરમિયાન લોકોનું રક્ષણ કરો, પછી પુનર્વસનનું નેતૃત્વ કરો: સ્વચ્છ પાણી, સારવાર, વીજળી, રસ્તા અને સલામત ઘરવાપસી.'
    npcs:
      village_head: વોર્ડ 1 પાસે પાણી ઝડપથી વધી રહ્યું છે. ગામલોકો અમારી પાસે સ્પષ્ટ સૂચનાની અપેક્ષા રાખે છે. શું આપણે ઔપચારિક ચેતવણી આપવી જોઈએ?
      rescue_worker: ડેપોમાં અમારી બે મોટર બચાવ હોડીઓ અને ત્રણ પરિવહન ટ્રક તૈયાર છે. રેતીની થેલીઓ પણ તૈયાર છે.
      family_member: મારાં માતાપિતા હરીફરી શકતાં નથી. કૃપા કરીને કોઝવે ડૂબે તે પહેલાં અમારા વડીલો માટે વાહન મોકલો.
      health_worker: જો લોકો લાંબો સમય આશ્રયમાં રહે, તો આપણે પીવાના પાણી અને દવાઓ વિશે વિચારવું પડશે.
      district_official: જિલ્લો હોડીઓ, ટ્રક અને રાહત સાથે કાફલો મોકલી શકે છે, પણ પહોંચતાં સમય લાગે છે.
rulecards:
  RC-01:
    title: વહેલી જાહેર ચેતવણી
    category: ચેતવણી
    guidance: જ્યારે નદીનો અંદાજ કાંઠા ઉપરથી પાણી વહેવાનો સંકેત આપે, ત્યારે તરત સત્તાવાર સ્થળાંતર સૂચના આપો. વહેલી ચેતવણીથી નબળા પરિવારોને કટોકટીનો સામાન ભેગો કરવાનો અને ઊંચી જગ્યાએ જવાનો સમય મળે છે.
  RC-02:
    title: સૌથી નબળા લોકોની મદદ
    category: સ્થળાંતર
    guidance: રસ્તા ડૂબે તે પહેલાં વૃદ્ધો, નાનાં બાળકો, સગર્ભા મહિલાઓ અને હરવાફરવામાં અસમર્થ લોકો માટે ખાસ વાહન અને સહાયને અગ્રતા આપો.
  RC-03:
    title: પૂરના પાણીમાં વાહન સલામતી
    category: પરિવહન
    guidance: ઘૂંટણથી ઊંડા વહેતા પાણીવાળા રસ્તા પર સામાન્ય વાહનો ન મોકલો. રસ્તા ડૂબે ત્યારે હોડીઓ કે ઊંચાં ખાસ વાહનો વાપરો.
  RC-04:
    title: પાળા પર રેતીની થેલીઓ મૂકવાની સારી રીત
    category: માળખું
    guidance: પૂરની ટોચ પહેલાં નીચા પાળા પર રેતીની થેલીઓ મૂકો. પાળો વહેલો મજબૂત કરવાથી ભંગાણ ધીમું થાય છે અને સ્થળાંતર માટે કીમતી કલાકો મળે છે.
  RC-05:
    title: સલામત આશ્રય સંચાલન
    category: આશ્રય
    guidance: લોકો પહોંચે તે પહેલાં ઊંચી જગ્યાએ આવેલી પાકી બહુમાળી જાહેર ઇમારતોને રાહત આશ્રય તરીકે ખોલો જેથી પ્રવેશ વ્યવસ્થિત અને સલામત રહે.
  RC-06:
    title: પૂર પછી સલામત પીવાનું પાણી
    category: પુનર્વસન
    guidance: પૂરનું પાણી કૂવા અને પાઇપોને દૂષિત કરે છે. પુનર્વસનની શરૂઆતમાં જ દેખરેખવાળું જળ શુદ્ધિકરણ કેન્દ્ર શરૂ કરવાથી આશ્રયમાં રહેતા અને પાછા ફરતા પરિવારોમાં પાણીજન્ય બીમારીનું જોખમ ઘટે છે.
  RC-07:
    title: આરોગ્ય નિરીક્ષણ અને તબીબી શિબિર
    category: પુનર્વસન
    guidance: ભીડવાળા આશ્રયો અને ભરાયેલું પાણી પેટ અને ચામડીની બીમારીઓની શક્યતા વધારે છે. આશ્રય પાસેની તબીબી શિબિર બીમારી ફેલાય તે પહેલાં ઓળખવામાં અને સારવારમાં મદદ કરે છે.
  RC-08:
    title: તપાસ પછી જ ઘરે પાછા ફરો
    category: પુનર્વસન
    guidance: રહેવાસીઓએ ત્યારે જ પાછા ફરવું જ્યારે વિસ્તાર સૂકો હોય, રસ્તો ખુલ્લો હોય અને તંત્રે ઘરોની માળખાકીય અને વીજળીની તપાસ કરી લીધી હોય.
  RC-09:
    title: આશ્રયોમાં પુરવઠો જાળવવો
    category: પુનર્વસન
    guidance: આશ્રયનો જથ્થો ખૂટે તે પહેલાં રાહત પુરવઠાનું આયોજન કરો. ખોરાક અને જરૂરી સામાનની અછતથી આરોગ્ય બગડે છે અને રાહત કાર્યમાં સમુદાયનો વિશ્વાસ ઘટે છે.
  RC-10:
    title: રસ્તા સાફ કરવા અને સેવાઓ પાછી લાવવી
    category: પુનર્વસન
    guidance: પહેલાં રસ્તા પરથી કાટમાળ હટાવો જેથી સમારકામ ટુકડીઓ સબસ્ટેશન અને આરોગ્ય કેન્દ્રો સુધી પહોંચી શકે. વીજળી આવતાં દવાખાનાં અને પાણીના પંપ ફરી ચાલે છે.
  RC-11:
    title: શહેરી ગટરો સાફ રાખો
    category: શહેરી પૂર
    guidance: બંધ ગટરો ભારે વરસાદને મિનિટોમાં શેરીના પૂરમાં ફેરવે છે. વાદળ ફાટે તે પહેલાં અને દરમિયાન અવરોધો દૂર કરવા અને લોકોને અંડરપાસથી દૂર રાખવાથી જોખમ ઘટે છે.
  RC-12:
    title: બંધમાંથી પાણી છોડવાની જાણ
    category: ચેતવણી
    guidance: નીચેનાં ગામોને બંધમાંથી પાણી છોડાય તે પહેલાં સૂચના જોઈએ. બંધ સત્તામંડળ સાથે વહેલું સંકલન કરો; સ્પષ્ટ ચેતવણી સાથે ધીમું, તબક્કાવાર પાણી છોડવાથી લોકોને ખસવાનો સમય મળે છે.
  RC-13:
    title: માછીમાર સમુદાયોની વાવાઝોડા તૈયારી
    category: વાવાઝોડું
    guidance: વાવાઝોડાની ચેતવણી મળતાં જ, ટકરાય તેના ઘણા પહેલાં, માછીમારી હોડીઓ પાછી બોલાવો. દરિયાકાંઠાના પરિવારોને વહેલા વાવાઝોડા આશ્રયમાં લઈ જાઓ કારણ કે પવન તેજ થતાં રસ્તા અને વીજળી બંધ થાય છે.
  RC-14:
    title: વહેલી બહારની મદદ માંગવી
    category: સંકલન
    guidance: જિલ્લા અને રાજ્યની ટુકડીઓને ગામ સુધી પહોંચતાં સમય લાગે છે. સ્થાનિક સંસાધનો અપૂરતાં લાગે કે તરત બહારની મદદ માંગો, ખૂટી જાય ત્યાં સુધી રાહ ન જુઓ.
