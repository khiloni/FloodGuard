sentences:
  A cleared road let repair crews reach the substation.: સાફ કરેલા રસ્તાથી સમારકામ ટુકડીઓ સબસ્ટેશન સુધી પહોંચી શકી.
  A delivery after the low-stock warning kept the shelter supplied.: ઓછા જથ્થાની ચેતવણી પછીના પુરવઠાથી આશ્રયમાં સામાન રહ્યો.
  A district convoy arrived with {n1} boats, {n2} trucks, {n3} sandbags and {n4} supply units.: જિલ્લાનો કાફલો {n1} હોડીઓ, {n2} ટ્રક, {n3} રેતીની થેલીઓ અને {n4} પુરવઠા એકમો સાથે આવ્યો.
  A medical camp opened beside the shelter to check residents and treat illness.: રહેવાસીઓની તપાસ અને બીમારીની સારવાર માટે આશ્રયની બાજુમાં તબીબી શિબિર ખૂલી.
  A medical camp would help them.: તબીબી શિબિરથી તેમને મદદ મળશે.
  A medical camp would let us treat them.: તબીબી શિબિરથી આપણે તેમની સારવાર કરી શકીશું.
  A recall message reached {n1} fishing boats at sea.: પાછા ફરવાનો સંદેશ દરિયામાં {n1} માછીમારી હોડીઓ સુધી પહોંચ્યો.
  A relief delivery of {n1} supply units reached the shelter.: '{n1} પુરવઠા એકમોનો રાહત જથ્થો આશ્રયમાં પહોંચ્યો.'
  A road is open now, so the crews can reach the substation and restore power.: હવે એક રસ્તો ખુલ્લો છે, તેથી ટુકડીઓ સબસ્ટેશને પહોંચીને વીજળી ચાલુ કરી શકે છે.
  A slower release added less water at a time, so the river stayed lower.: ધીમે છોડવાથી એક સમયે ઓછું પાણી આવ્યું, તેથી નદી નીચી રહી.
  A water purification point started supplying safe drinking water to the shelter and wards.: જળ શુદ્ધિકરણ કેન્દ્રે આશ્રય અને વોર્ડોને સલામત પીવાનું પાણી આપવાનું શરૂ કર્યું.
  Access road to {p1} submerged beneath {n1} cm of water.: '{p1} જતો રસ્તો {n1} સેમી પાણીમાં ડૂબી ગયો.'
  After the flood: પૂર પછી
  All our teams are deployed.: અમારી બધી ટુકડીઓ કામે લાગી છે.
  Assigned boats and trucks moved people out of this ward.: મોકલેલી હોડીઓ અને ટ્રકોએ લોકોને આ વોર્ડમાંથી બહાર કાઢ્યા.
  Assigned {n1} motorized rescue boat(s) to {p1}.: '{p1} માટે {n1} મોટર બચાવ હોડી મોકલવામાં આવી.'
  Before the flood: પૂર પહેલાં
  Blocked drains overflowed in {p1}; streets are filling with water.: '{p1}માં બંધ ગટરો ઊભરાઈ; શેરીઓમાં પાણી ભરાઈ રહ્યું છે.'
  Boats carry {n1} each from {p1}; they stay committed there.: દરેક હોડી {p1}માંથી {n1} લોકોને લઈ જાય છે; હોડીઓ ત્યાં જ રોકાય છે.
  Boats need time to reach the harbour; recalling them early keeps crews safe.: હોડીઓને બંદરે પહોંચતા સમય લાગે છે; વહેલા બોલાવવાથી ટુકડીઓ સલામત રહે છે.
  Boats, trucks and relief arrive after {n1} ticks; it can be requested only once.: હોડીઓ, ટ્રક અને રાહત {n1} વારા પછી આવે છે; તે માત્ર એક જ વાર માંગી શકાય.
  Brings the health centre and water pumps back; needs one cleared road.: આરોગ્ય કેન્દ્ર અને પાણીના પંપ ફરી ચાલુ થાય છે; એક સાફ રસ્તો જોઈએ.
  'CASUALTIES REPORTED: Severe flooding ({n1} cm) stranded residents in {p1}! {n2} casualties reported.': 'જાનહાનિના અહેવાલ: ભારે પૂર ({n1} સેમી)માં {p1}ના રહેવાસીઓ ફસાયા! {n2} લોકોની જાનહાનિ.'
  'CRITICAL BREACH: Embankment barrier collapsed under intense hydraulic pressure!': 'ગંભીર ભંગાણ: પાણીના ભારે દબાણથી પાળો તૂટી ગયો!'
