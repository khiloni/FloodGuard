  'Engineers surveyed {p1}: {n1} of {n2} houses damaged; the water had reached {n3} cm.': 'ಎಂಜಿನಿಯರ್‌ಗಳು {p1} ಸಮೀಕ್ಷೆ ಮಾಡಿದರು: {n2} ಮನೆಗಳಲ್ಲಿ {n1} ಹಾನಿ; ನೀರು {n3} ಸೆಂ.ಮೀ. ತಲುಪಿತ್ತು.'
