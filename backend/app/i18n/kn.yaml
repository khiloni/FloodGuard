  'Defensive engineering: Crews laid {n1} sandbags.': 'ರಕ್ಷಣಾ ಕಾರ್ಯ: ತಂಡಗಳು {n1} ಮರಳು ಚೀಲಗಳನ್ನು ಜೋಡಿಸಿದವು.'
