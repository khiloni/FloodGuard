  Brings the health centre and water pumps back; needs one cleared road.: ಆರೋಗ್ಯ ಕೇಂದ್ರ ಮತ್ತು ನೀರಿನ ಪಂಪುಗಳು ಮತ್ತೆ ಕೆಲಸ ಮಾಡುತ್ತವೆ; ಒಂದು ತೆರವಾದ ರಸ್ತೆ ಬೇಕು.
  'CASUALTIES REPORTED: Severe flooding ({n1} cm) stranded residents in {p1}! {n2} casualties reported.': 'ಸಾವುನೋವು ವರದಿ: ತೀವ್ರ ಪ್ರವಾಹದಲ್ಲಿ ({n1} ಸೆಂ.ಮೀ.) {p1} ನಿವಾಸಿಗಳು ಸಿಲುಕಿದರು! {n2} ಸಾವುನೋವು.'
