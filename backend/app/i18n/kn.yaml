  Boats need time to reach the harbour; recalling them early keeps crews safe.: ದೋಣಿಗಳು ಬಂದರು ತಲುಪಲು ಸಮಯ ಬೇಕು; ಬೇಗ ಕರೆಸಿದರೆ ಸಿಬ್ಬಂದಿ ಸುರಕ್ಷಿತವಾಗಿರುತ್ತಾರೆ.
