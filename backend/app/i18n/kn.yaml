  'Logistics update: Assigned {n1} motorized rescue boat(s) to {p1}.': 'ಸರಬರಾಜು ಮಾಹಿತಿ: {p1}ಗೆ {n1} ಯಾಂತ್ರಿಕ ರಕ್ಷಣಾ ದೋಣಿಗಳನ್ನು ಕಳುಹಿಸಲಾಯಿತು.'
  'Logistics update: Dispatched {n1} transport truck(s) to {p1}.': 'ಸರಬರಾಜು ಮಾಹಿತಿ: {p1}ಗೆ {n1} ಸಾರಿಗೆ ಲಾರಿಗಳನ್ನು ಕಳುಹಿಸಲಾಯಿತು.'
  Lowers the extra water from the release at tick {n1} but keeps the river high for longer.: ಸರದಿ {n1}ರ ಬಿಡುಗಡೆಯ ಹೆಚ್ಚುವರಿ ನೀರು ಕಡಿಮೆಯಾಗುತ್ತದೆ, ಆದರೆ ನದಿ ಹೆಚ್ಚು ಹೊತ್ತು ಎತ್ತರದಲ್ಲಿರುತ್ತದೆ.
