  'Evacuation progress: Evacuated {n1} residents from {p1} to safety.': 'ಸ್ಥಳಾಂತರ ಪ್ರಗತಿ: {p1}ನಿಂದ {n1} ನಿವಾಸಿಗಳನ್ನು ಸುರಕ್ಷಿತವಾಗಿ ಸ್ಥಳಾಂತರಿಸಲಾಯಿತು.'
