  Clean water removed the main source of illness.: ಶುದ್ಧ ನೀರಿನಿಂದ ಕಾಯಿಲೆಯ ಮುಖ್ಯ ಮೂಲ ನಿವಾರಣೆಯಾಯಿತು.
  Clear at least one road first.: ಮೊದಲು ಕನಿಷ್ಠ ಒಂದು ರಸ್ತೆಯನ್ನು ತೆರವುಗೊಳಿಸಿ.
  Clear drains let rainwater run off instead of filling the streets.: ತೆರವಾದ ಚರಂಡಿಗಳಿಂದ ಮಳೆನೀರು ಬೀದಿಗಳಲ್ಲಿ ನಿಲ್ಲದೆ ಹರಿದುಹೋಯಿತು.
  Clear it first.: ಮೊದಲು ಅದನ್ನು ತೆರವುಗೊಳಿಸಿ.
