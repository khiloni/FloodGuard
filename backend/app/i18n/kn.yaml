  'Hydrology monitor: the river is at {n1} cm.': 'ಜಲಮಟ್ಟ ನಿಗಾ: ನದಿ {n1} ಸೆಂ.ಮೀ.ನಲ್ಲಿದೆ.'
  I can send a convoy with boats, trucks and relief.: ನಾನು ದೋಣಿಗಳು, ಲಾರಿಗಳು ಮತ್ತು ಪರಿಹಾರದೊಂದಿಗೆ ವಾಹನ ಪಡೆ ಕಳುಹಿಸಬಲ್ಲೆ.
