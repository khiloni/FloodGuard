sentences:
  A cleared road let repair crews reach the substation.: శుభ్రం చేసిన రోడ్డు వల్ల మరమ్మతు బృందాలు ఉపకేంద్రాన్ని చేరగలిగాయి.
  A delivery after the low-stock warning kept the shelter supplied.: తక్కువ నిల్వ హెచ్చరిక తర్వాతి సరఫరాతో ఆశ్రయంలో సరుకులు నిలిచాయి.
  A district convoy arrived with {n1} boats, {n2} trucks, {n3} sandbags and {n4} supply units.: జిల్లా కాన్వాయ్ {n1} పడవలు, {n2} లారీలు, {n3} ఇసుక బస్తాలు, {n4} సరఫరా యూనిట్లతో వచ్చింది.
  A medical camp opened beside the shelter to check residents and treat illness.: నివాసితులను పరీక్షించి వ్యాధులకు చికిత్స చేయడానికి ఆశ్రయం పక్కన వైద్య శిబిరం తెరిచారు.
  A medical camp would help them.: వైద్య శిబిరం వారికి సహాయపడుతుంది.
  A medical camp would let us treat them.: వైద్య శిబిరం ఉంటే మనం వారికి చికిత్స చేయగలం.
  A recall message reached {n1} fishing boats at sea.: తిరిగి రమ్మనే సందేశం సముద్రంలోని {n1} చేపల పడవలకు చేరింది.
  A relief delivery of {n1} supply units reached the shelter.: '{n1} సరఫరా యూనిట్ల సహాయం ఆశ్రయానికి చేరింది.'
  A road is open now, so the crews can reach the substation and restore power.: ఇప్పుడు ఒక రోడ్డు తెరిచి ఉంది, కాబట్టి బృందాలు ఉపకేంద్రం చేరి విద్యుత్ పునరుద్ధరించగలవు.
  A slower release added less water at a time, so the river stayed lower.: నెమ్మదిగా విడుదల చేయడంతో ఒకసారికి తక్కువ నీరు వచ్చింది, అందుకే నది తక్కువ ఎత్తులో ఉంది.
  A water purification point started supplying safe drinking water to the shelter and wards.: నీటి శుద్ధి కేంద్రం ఆశ్రయానికి, వార్డులకు సురక్షిత తాగునీరు ఇవ్వడం మొదలుపెట్టింది.
  Access road to {p1} submerged beneath {n1} cm of water.: '{p1}కి వెళ్ళే రోడ్డు {n1} సెం.మీ. నీటిలో మునిగింది.'
  After the flood: వరద తర్వాత
  All our teams are deployed.: మా బృందాలన్నీ పనిలో ఉన్నాయి.
  Assigned boats and trucks moved people out of this ward.: పంపిన పడవలు, లారీలు ప్రజలను ఈ వార్డు నుంచి తరలించాయి.
  Assigned {n1} motorized rescue boat(s) to {p1}.: '{p1}కి {n1} మోటారు సహాయ పడవలు పంపారు.'
  Before the flood: వరదకు ముందు
  Blocked drains overflowed in {p1}; streets are filling with water.: '{p1}లో మూసుకుపోయిన కాలువలు పొంగిపొర్లాయి; వీధుల్లో నీరు నిండుతోంది.'
  Boats carry {n1} each from {p1}; they stay committed there.: ప్రతి పడవ {p1} నుంచి {n1} మందిని తీసుకెళ్తుంది; పడవలు అక్కడే ఉంటాయి.
  Boats need time to reach the harbour; recalling them early keeps crews safe.: పడవలు రేవు చేరడానికి సమయం పడుతుంది; ముందుగా పిలిస్తే సిబ్బంది సురక్షితంగా ఉంటారు.
  Boats, trucks and relief arrive after {n1} ticks; it can be requested only once.: పడవలు, లారీలు, సహాయం {n1} మలుపుల తర్వాత వస్తాయి; ఇది ఒక్కసారే అడగవచ్చు.
