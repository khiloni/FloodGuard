  Water breached into {p1}.: నీరు {p1}లోకి చొచ్చుకుపోయింది.
  Water is coming into our homes in {p1}.: '{p1}లో మా ఇళ్ళలోకి నీరు వస్తోంది.'
  Waterborne disease risk rose to {n1} out of {n2}.: నీటి ద్వారా వచ్చే వ్యాధి ప్రమాదం {n2}కి {n1}కి పెరిగింది.
  We are packing our documents and waiting for instructions.: మేము మా పత్రాలు సర్దుకుని సూచనల కోసం ఎదురుచూస్తున్నాం.
  We have sent everything we can.: మేము పంపగలిగినదంతా పంపాం.
  We have {n1} boat(s) ready.: మా దగ్గర {n1} పడవలు సిద్ధంగా ఉన్నాయి.
  We just want to go home safely when our area is ready.: మా ప్రాంతం సిద్ధమైనప్పుడు సురక్షితంగా ఇంటికి వెళ్ళాలనే మేము కోరుకుంటున్నాం.
  We must open {p1} now.: మనం ఇప్పుడే {p1} తెరవాలి.
  We need enough food and clean water there, and the vulnerable must be checked first.: అక్కడ తగినంత ఆహారం, శుభ్రమైన నీరు కావాలి; బలహీనులను ముందుగా పరీక్షించాలి.
  We need the damage figures for compensation.: పరిహారం కోసం మాకు నష్టం లెక్కలు కావాలి.
  We should lay sandbags; we have {n1} ready.: మనం ఇసుక బస్తాలు పేర్చాలి; మా దగ్గర {n1} సిద్ధంగా ఉన్నాయి.
  We still have {n1} supply deliveries at the depot.: డిపోలో ఇంకా {n1} సరఫరాలు ఉన్నాయి.
  Wells and pipes are contaminated.: బావులు, పైపులు కలుషితమయ్యాయి.
  Wheeled transport blocked.: చక్రాల వాహనాలు ఆగిపోయాయి.
  Wheeled vehicles cannot safely traverse.: చక్రాల వాహనాలు సురక్షితంగా దాటలేవు.
  Wheeled vehicles could no longer reach {p1}; only boats could.: చక్రాల వాహనాలు ఇక {p1}ని చేరలేకపోయాయి; పడవలు మాత్రమే చేరగలిగాయి.
  Which area's drains should be cleared?: ఏ ప్రాంతపు కాలువలను శుభ్రం చేయాలి?
  Which ward should engineers survey?: ఇంజనీర్లు ఏ వార్డును సర్వే చేయాలి?
  Which ward should receive the mandatory evacuation order?: ఏ వార్డుకు తప్పనిసరి తరలింపు ఆదేశం ఇవ్వాలి?
  Which ward should the search and rescue teams go to?: గాలింపు, సహాయ బృందాలు ఏ వార్డుకు వెళ్ళాలి?
  Which ward's residents should return home?: ఏ వార్డు నివాసితులు ఇంటికి తిరిగి వెళ్ళాలి?
  Which ward's road should be cleared?: ఏ వార్డు రోడ్డును శుభ్రం చేయాలి?
  Which zone should the boat(s) be dispatched to?: పడవలను ఏ ప్రాంతానికి పంపాలి?
  With power back, the village health centre reopened.: విద్యుత్ తిరిగి రావడంతో గ్రామ ఆరోగ్య కేంద్రం మళ్ళీ తెరుచుకుంది.
  With the shelter open, evacuees had a safe place to go.: ఆశ్రయం తెరిచి ఉండటంతో తరలించినవారికి వెళ్ళడానికి సురక్షిత స్థలం ఉంది.
  Without clean water, waterborne disease risk kept rising.: శుభ్రమైన నీరు లేకుండా నీటి ద్వారా వచ్చే వ్యాధి ప్రమాదం పెరుగుతూనే ఉంది.
  Zone '{p1}' has no remaining population to evacuate.: '''{p1}''లో తరలించడానికి ఎవరూ మిగలలేదు.'
  Zone '{p1}' has no residents awaiting transport.: '''{p1}''లో వాహనం కోసం ఎదురుచూసే నివాసి ఎవరూ లేరు.'
  Zone '{p1}' has no vulnerable individuals awaiting evacuation.: '''{p1}''లో తరలింపు కోసం ఎదురుచూసే బలహీనులు ఎవరూ లేరు.'
  '{n1} boats need about {n2} ticks to return; landfall is at tick {n3}.': '{n1} పడవలు తిరిగి రావడానికి సుమారు {n2} మలుపులు పడుతుంది; తుపాను మలుపు {n3}లో తీరం దాటుతుంది.'
  '{n1} fishers were still at sea when the cyclone hit and are missing.': తుపాను తాకినప్పుడు {n1} మంది మత్స్యకారులు సముద్రంలో ఉన్నారు, వారు కనిపించడం లేదు.
  '{n1} fishing boats reached the harbour safely.': '{n1} చేపల పడవలు సురక్షితంగా రేవు చేరాయి.'
  '{n1} people are ill now; the camp also slows the spread of disease.': ఇప్పుడు {n1} మంది అనారోగ్యంతో ఉన్నారు; శిబిరం వ్యాధి వ్యాప్తిని కూడా తగ్గిస్తుంది.
  '{n1} people are in shelters now.': ఇప్పుడు {n1} మంది ఆశ్రయాల్లో ఉన్నారు.
  '{n1} people are stranded in {p1}.': '{p1}లో {n1} మంది చిక్కుకున్నారు.'
  '{n1} people from {p1} can go home, easing the crowded shelter.': '{p1}లోని {n1} మంది ఇంటికి వెళ్ళవచ్చు; దీంతో రద్దీగా ఉన్న ఆశ్రయానికి ఊరట.'
  '{n1} people have untreated illness.': '{n1} మంది వ్యాధికి చికిత్స జరగలేదు.'
  '{n1} people in {p1}; the water is forecast to reach {n2} cm against ground at {n3} cm.': '{p1}లో {n1} మంది; నేల {n3} సెం.మీ. వద్ద ఉంది, నీరు {n2} సెం.మీ. వరకు చేరుతుందని అంచనా.'
  '{n1} residents of {p1} returned home from the shelter.': '{p1}లోని {n1} మంది నివాసితులు ఆశ్రయం నుంచి ఇంటికి తిరిగి వెళ్ళారు.'
  '{n1} residents reported stomach illness linked to unsafe water.': '{n1} మంది నివాసితులకు అసురక్షిత నీటి వల్ల కడుపు వ్యాధి.'
  '{n1} stranded residents reached the shelter.': '{n1} మంది చిక్కుకున్న నివాసితులు ఆశ్రయం చేరారు.'
  '{n1} truck(s) are free while the roads are still open.': రోడ్లు తెరిచి ఉన్నంతవరకు {n1} లారీలు ఖాళీగా ఉన్నాయి.
  '{n1} truck(s) carry {n2} each while the road is dry; they stop once it floods.': రోడ్డు పొడిగా ఉన్నంతవరకు {n1} లారీలు, ఒక్కొక్కటి {n2} మందిని తీసుకెళ్తాయి; నీరు నిలవగానే ఆగిపోతాయి.
  '{n1} vulnerable individuals from {p1} reached secure shelter.': '{p1}లోని {n1} మంది బలహీనులు సురక్షిత ఆశ్రయం చేరారు.'
  '{n1} vulnerable residents are still at home.': '{n1} మంది బలహీన నివాసితులు ఇంకా ఇంట్లో ఉన్నారు.'
  '{n1} vulnerable residents in {p1} move first; others wait a little longer.': '{p1}లోని {n1} మంది బలహీన నివాసితులు ముందుగా వెళ్తారు; మిగతావారు కొంచెం ఆగుతారు.'
  '{n1} ward(s) had been flooded.': '{n1} వార్డులు మునిగిపోయాయి.'
  '{p1} has already been surveyed.': '{p1} ఇప్పటికే సర్వే అయింది.'
  '{p1} is still under {n1} cm of water.': '{p1} ఇంకా {n1} సెం.మీ. నీటిలో ఉంది.'
  '{p1} must have a damage survey before residents return.': నివాసితులు తిరిగి రాకముందే {p1} నష్ట సర్వే తప్పనిసరి.
  '{p1} needs clear direction.': '{p1}కి స్పష్టమైన దిశానిర్దేశం కావాలి.'
  '{p1} stayed dry; its residents are safe at home and need no rescue.': '{p1} పొడిగా ఉంది; అక్కడి నివాసితులు ఇంట్లో సురక్షితంగా ఉన్నారు, సహాయం అవసరం లేదు.'
  '{p1} was not flooded; no damage survey is needed.': '{p1}లో వరద రాలేదు; నష్ట సర్వే అవసరం లేదు.'
  '{p1}: The medical camp treated {n1} residents.': '{p1}: వైద్య శిబిరం {n1} మంది నివాసితులకు చికిత్స చేసింది.'
scenarios:
  cyclone-surge-01:
    name: మఛ్ఛివాడలో తుపాను
    hazard_label: తుపాను సముద్ర ఉప్పెన
    hook: తుపాను కొన్ని గంటల్లో తీరం దాటుతుంది, చేపల పడవలు ఇంకా సముద్రంలో ఉన్నాయి, తుపాను ఆశ్రయంలో అందరికీ చోటు లేదు.
    description: తీవ్ర తుపాను ఒక మత్స్యకారుల గ్రామం వైపు వస్తోంది. ఉప్పెన సముద్రాన్ని సముద్ర గోడపైకి నెడుతుంది. తుపాను తీరం దాటకముందే ప్రజలను తరలించండి, పడవలను వెనక్కి పిలవండి, రద్దీగా ఉన్న తుపాను ఆశ్రయాన్ని నిర్వహించండి.
    npcs:
      village_head: హెచ్చరికకు ముందే మా ఎనిమిది పడవలు సముద్రంలోకి వెళ్ళాయి. వారి కుటుంబాలు తీరంలో ఏం చేయాలని అడుగుతున్నాయి.
      rescue_worker: రేడియోలో మత్స్యకారులను సంప్రదించగలం, కానీ వారు రేవుకు తిరిగి రావడానికి సుమారు గంటన్నర పడుతుంది.
      family_member: నా భర్త ఇంకా సముద్రంలో ఉన్నారు, మా మామగారు మంచాన పడ్డారు. ఇద్దరినీ వదిలి వెళ్ళలేను.
      health_worker: తుపాను ఆశ్రయం చాలా రద్దీగా ఉంటుంది. శుభ్రమైన నీరు, వైద్య శిబిరం గురించి ప్రణాళిక వేయాలి.
      district_official: రాష్ట్రం పడవలు, సహాయం పంపగలదు, కానీ గాలి పెరగగానే రోడ్లు తెగిపోతాయి.
  dam-release-01:
    name: కాళింది ఆనకట్ట దిగువన
    hazard_label: ఆనకట్ట నీటి విడుదల
    hook: కొన్ని గంటల్లో ఆనకట్ట నీటిని విడుదల చేయాలి. ప్రతి గ్రామాన్ని సమయానికి హెచ్చరించి, విడుదలను నెమ్మది చేయించగలరా?
    description: ఎగువన భారీ వర్షాల వల్ల కాళింది ఆనకట్ట నుంచి షెడ్యూల్ ప్రకారం నీటి విడుదల జరగనుంది. దిగువ నది ఇప్పటికే ఎత్తుగా ఉంది. సమయం, ప్రతి గ్రామానికి సందేశం చేరడమే ఫలితాన్ని నిర్ణయిస్తాయి.
    npcs:
      village_head: ఇక్కడ చాలా కుటుంబాలు నదీతీరంలో వ్యవసాయం చేస్తాయి. ముందస్తు సమాచారం లేకుండా ఆనకట్ట తెరిస్తే వారు పొలాల్లో చిక్కుకుంటారు.
      rescue_worker: రేవు దగ్గర మాకు మూడు పడవలు, రెండు జీపులు ఉన్నాయి. గుడి పల్లెకు వెళ్ళే తక్కువ ఎత్తు వంతెన త్వరగా మునుగుతుంది.
      family_member: మా అమ్మ ఎక్కువ దూరం నడవలేదు. నీరు రాకముందే ఎవరైనా మాకు చెబుతారా?
      health_worker: ఏ ఇళ్ళలో వృద్ధులు, గర్భిణులు ఉన్నారో నాకు తెలుసు. వారిని ముందుగా తరలించాలి.
      district_official: ఆనకట్టను సురక్షితంగా ఉంచడానికి ఇంజనీర్లు నీరు విడుదల చేయాల్సిందే. ముందుగా అడిగితే నెమ్మదిగా విడుదల చేయడానికి ఒప్పుకోవచ్చు.
  glacial-lake-01:
    name: త్సోమో లోయపై హిమానీనద సరస్సు పగులుట
    hazard_label: హిమానీనద సరస్సు పగులుట
    hook: లోయ పైన ఉన్న సరస్సు సెన్సార్లు ఇప్పుడే హెచ్చరిక మోగించాయి. నీరు, బండరాళ్ళ ప్రవాహం రావడానికి సుమారు రెండు గంటలు ఉంది.
    description: పర్వత లోయ పైన ఉన్న హిమానీనద సరస్సు సెన్సార్లు దాని మొరైన్ గోడ కూలవచ్చని హెచ్చరిస్తున్నాయి. సరస్సు పగిలితే నీరు, శిథిలాల గోడ కొన్ని గంటల్లో లోయను చేరుతుంది. తక్కువ సమయంలో అందరినీ పైకి తరలించండి, తర్వాత లోయను మళ్ళీ తెరవండి.
    npcs:
      village_head: నది కొంచెమే పెరిగిందని దుకాణదారులు అంటున్నారు. హెచ్చరిక స్పష్టంగా, గట్టిగా లేకపోతే వారు బజారు మూయరు.
      rescue_worker: నాలుగు లారీలు, ఒక రబ్బరు పడవ. శిథిలాల ప్రవాహంలో పడవ పనికిరాదు; రోడ్డు ఉన్నంతవరకు లారీలే మనకు ఆధారం.
      family_member: మా నానమ్మకు తొంభై ఏళ్ళు, మఠం మెట్లు ఎక్కలేరు. దయచేసి వృద్ధుల కోసం ముందుగా వాహనం పంపండి.
      health_worker: కొండపై చల్లని రాత్రులు పసిపిల్లలకు, వృద్ధులకు కష్టం. మాకు దుప్పట్లు, శుభ్రమైన నీరు, వైద్య శిబిరం కావాలి.
      district_official: సరస్సు సెన్సార్లు హెచ్చరిక పంపాయి. మొబైల్ హెచ్చరిక సిద్ధంగా ఉంది, కానీ సైరన్ మోగించే నిర్ణయం మీదే.
  river-island-01:
    name: 'కమల్‌పూర్ లంక: నదిలో ఒక దీవి'
    hazard_label: నదీ లంక వరద
    hook: ఉబుకుతున్న నది మధ్యలో ఇసుక లంకపై రెండు పల్లెలు ఉన్నాయి. దీవి నుంచి రోడ్డు లేదు, పడవలే, నది ప్రతి గంటకూ పెరుగుతోంది.
    description: 'పెద్ద నదిలో వర్షాకాల వరద ఇసుక లంకను చుట్టుముడుతోంది. ప్రధాన భూభాగానికి రోడ్డు లేదు: ప్రతిసారి దాటడానికి పడవ కావాలి. లంక కుటుంబాలను ముందుగా తరలించండి, వలయ కట్టను నిలబెట్టండి, తర్వాత అందరినీ ఇంటికి తీసుకురండి.'
    npcs:
      village_head: ప్రతి వర్షాకాలం నది మా దీవిని ఇంకొంచెం మింగేస్తుంది. నమ్మకమైనవారు ముందుగా చెబితేనే ప్రజలు తమ పశువులను, మగ్గాలను వదిలి వస్తారు.
      rescue_worker: రేవు దగ్గర ఇంజన్లున్న మూడు నాటు పడవలు కట్టి ఉన్నాయి. ప్రతిసారి దాటడానికి సమయం పడుతుంది, నది పెరిగేకొద్దీ ప్రవాహం బలపడుతుంది.
      family_member: మా చిన్నవాడికి జ్వరం, మా అత్తగారు ఎక్కువ దూరం నడవలేరు. నీరు వాకిలి దాకా వస్తే మేము చిక్కుకుపోతాం.
      health_worker: నీరు తగ్గాక ప్రజలు మునిగిన చేతిపంపుల నీరు తాగుతారు. మాకు క్లోరిన్ మాత్రలు, వేదికపై వైద్య శిబిరం కావాలి.
      district_official: జిల్లా మరిన్ని పడవలు, సహాయం పంపగలదు, కానీ అవి ముందుగా రోడ్డు మార్గంలో రేవుకు, తర్వాత నీటి మార్గంలో వస్తాయి.
  urban-flash-flood-01:
    name: వార్డు 14 ఆకస్మిక వరద
    hazard_label: పట్టణ ఆకస్మిక వరద
    hook: రద్దీగా ఉన్న పట్టణ వార్డుపై కుండపోత. కాలువలు మూసుకుపోయాయి, అండర్‌పాస్ ముందుగా నిండుతుంది, మీకు గంటలు కాదు, నిమిషాలే ఉన్నాయి.
    description: నగరంలోని ఒక వార్డుపై కుండపోత వర్షం. మూసుకుపోయిన కాలువలు, రైల్వే అండర్‌పాస్ కొన్ని నిమిషాల్లో వీధులను వాగులుగా మారుస్తాయి. త్వరగా చర్య తీసుకోండి, తర్వాత విద్యుత్, రోడ్లు, సురక్షిత నీటిని పునరుద్ధరించండి.
    npcs:
      village_head: మార్కెట్ వెనుక కాలువలు మళ్ళీ ప్లాస్టిక్‌తో మూసుకుపోయాయి. వర్షం కొనసాగితే అండర్‌పాస్ ముందుగా నిండుతుంది.
      rescue_worker: మా దగ్గర రెండు సహాయ డింగీలు, నాలుగు లారీలు ఉన్నాయి. నీరు ఫుట్‌పాత్ పైకి వస్తే లారీలు అండర్‌పాస్ గుండా వెళ్ళలేవు.
      family_member: మా సందులో ఇప్పటికే చీలమండల లోతు నీరు ఉంది, మా పొరుగువారు చక్రాల కుర్చీ వాడతారు.
      health_worker: మురుగు కలిసిన వరద నీరు తీవ్ర ప్రమాదం. తర్వాత మాకు త్వరగా శుభ్రమైన నీరు కావాలి.
      district_official: రాష్ట్ర విపత్తు దళం పడవలు పంపగలదు, కానీ ఈ వార్డు చేరడానికి వారికి కొన్ని గంటలు పడుతుంది.
  village-river-01:
    name: నదీతీర గ్రామంలో వరద సహాయం
    hazard_label: నది వరద
    hook: వర్షాకాల ఉపనది మూడు వార్డుల పక్కన పెరుగుతోంది. హెచ్చరించండి, తరలించండి, కట్టను కాపాడండి, తర్వాత పునరావాసానికి నాయకత్వం వహించండి.
    description: 'పెరుగుతున్న ఉపనది మూడు వార్డులకు ముప్పుగా మారింది. వరద గరిష్ఠానికి చేరకముందే హెచ్చరించి తరలించండి, వరద సమయంలో ప్రజలను కాపాడండి, తర్వాత పునరావాసానికి నాయకత్వం వహించండి: శుభ్రమైన నీరు, వైద్యం, విద్యుత్, రోడ్లు, సురక్షితంగా ఇంటికి తిరుగు.'
    npcs:
      village_head: వార్డు 1 దగ్గర నీరు వేగంగా పెరుగుతోంది. గ్రామస్తులు మా నుంచి స్పష్టమైన సూచనలు ఆశిస్తున్నారు. అధికారిక హెచ్చరిక జారీ చేద్దామా?
      rescue_worker: డిపోలో మా రెండు మోటారు సహాయ పడవలు, మూడు రవాణా లారీలు సిద్ధంగా ఉన్నాయి. ఇసుక బస్తాలు కూడా సిద్ధం.
      family_member: మా తల్లిదండ్రులు కదలలేరు. దయచేసి కాజ్‌వే మునగకముందే మా పెద్దల కోసం వాహనం పంపండి.
      health_worker: ప్రజలు ఎక్కువకాలం ఆశ్రయంలో ఉంటే తాగునీరు, మందుల గురించి ఆలోచించాలి.
      district_official: జిల్లా పడవలు, లారీలు, సహాయంతో కాన్వాయ్ పంపగలదు, కానీ చేరడానికి సమయం పడుతుంది.
rulecards:
  RC-01:
    title: ముందస్తు బహిరంగ హెచ్చరిక
    category: హెచ్చరికలు
    guidance: నది అంచనాలు గట్టు దాటే ప్రమాదాన్ని సూచిస్తే వెంటనే అధికారిక తరలింపు సూచనలు జారీ చేయండి. ముందస్తు హెచ్చరిక బలహీన కుటుంబాలకు అత్యవసర సామగ్రి సర్దుకుని ఎత్తైన ప్రదేశానికి వెళ్ళే సమయం ఇస్తుంది.
  RC-02:
    title: అత్యంత బలహీనులకు సహాయం
    category: తరలింపు
    guidance: రోడ్లు మునగకముందే వృద్ధులు, చిన్నపిల్లలు, గర్భిణులు, కదలలేనివారికి ప్రత్యేక వాహనాలు, సహాయానికి ప్రాధాన్యం ఇవ్వండి.
  RC-03:
    title: వరద నీటిలో వాహన భద్రత
    category: రవాణా
    guidance: మోకాలు లోతు కంటే ఎక్కువ ప్రవహించే నీరున్న రోడ్లపై సాధారణ వాహనాలు పంపవద్దు. రోడ్లు మునిగితే పడవలు లేదా ఎత్తైన ప్రత్యేక వాహనాలు వాడండి.
  RC-04:
    title: కట్టపై ఇసుక బస్తాలు పేర్చే సరైన విధానం
    category: మౌలిక సదుపాయాలు
    guidance: వరద గరిష్ఠానికి ముందే తక్కువ ఎత్తు కట్టలపై ఇసుక బస్తాలు పేర్చండి. కట్టను ముందుగా బలపరిస్తే గండి నెమ్మదిస్తుంది, తరలింపుకు విలువైన గంటలు లభిస్తాయి.
  RC-05:
    title: సురక్షిత ఆశ్రయ నిర్వహణ
    category: ఆశ్రయం
    guidance: ప్రజలు రాకముందే ఎత్తైన ప్రదేశంలోని పటిష్ఠ బహుళ అంతస్తుల ప్రభుత్వ భవనాలను సహాయ ఆశ్రయాలుగా తెరవండి, తద్వారా ప్రవేశం క్రమబద్ధంగా, సురక్షితంగా ఉంటుంది.
  RC-06:
    title: వరద తర్వాత సురక్షిత తాగునీరు
    category: పునరావాసం
    guidance: వరద నీరు బావులను, పైపులను కలుషితం చేస్తుంది. పునరావాసం ప్రారంభంలోనే పర్యవేక్షణలో నీటి శుద్ధి కేంద్రం ఏర్పాటు చేస్తే ఆశ్రయంలోని, తిరిగి వచ్చే కుటుంబాలకు నీటి ద్వారా వచ్చే వ్యాధి ప్రమాదం తగ్గుతుంది.
  RC-07:
    title: ఆరోగ్య పర్యవేక్షణ, వైద్య శిబిరాలు
    category: పునరావాసం
    guidance: రద్దీ ఆశ్రయాలు, నిలిచిన నీరు కడుపు, చర్మ వ్యాధుల అవకాశాన్ని పెంచుతాయి. ఆశ్రయం దగ్గరి వైద్య శిబిరం వ్యాధి వ్యాపించకముందే గుర్తించి చికిత్స చేయడానికి సహాయపడుతుంది.
  RC-08:
    title: తనిఖీ తర్వాతే ఇంటికి తిరిగి వెళ్ళండి
    category: పునరావాసం
    guidance: ప్రాంతం పొడిగా ఉండి, రోడ్డు తెరిచి ఉండి, అధికారులు ఇళ్ళ నిర్మాణం, విద్యుత్ నష్టాన్ని తనిఖీ చేసిన తర్వాతే నివాసితులు తిరిగి వెళ్ళాలి.
  RC-09:
    title: ఆశ్రయాలకు సరఫరా కొనసాగించడం
    category: పునరావాసం
    guidance: ఆశ్రయ నిల్వలు అయిపోకముందే సహాయ సరఫరాను ప్రణాళిక చేయండి. ఆహారం, నిత్యావసరాల కొరత ఆరోగ్యాన్ని దెబ్బతీసి, సహాయ కార్యక్రమంపై సమాజ నమ్మకాన్ని తగ్గిస్తుంది.
  RC-10:
    title: రోడ్ల శుభ్రత, సేవల పునరుద్ధరణ
    category: పునరావాసం
    guidance: ముందుగా రోడ్లపై శిథిలాలు తొలగించండి, తద్వారా మరమ్మతు బృందాలు ఉపకేంద్రాలను, ఆరోగ్య కేంద్రాలను చేరగలవు. విద్యుత్ వస్తే క్లినిక్‌లు, నీటి పంపులు మళ్ళీ పనిచేస్తాయి.
  RC-11:
    title: పట్టణ కాలువలను శుభ్రంగా ఉంచండి
    category: పట్టణ వరద
    guidance: మూసుకుపోయిన కాలువలు భారీ వర్షాన్ని కొన్ని నిమిషాల్లో వీధి వరదగా మారుస్తాయి. కుండపోతకు ముందు, సమయంలో అడ్డంకులు తొలగించి, ప్రజలను అండర్‌పాస్‌లకు దూరంగా ఉంచితే ప్రమాదం తగ్గుతుంది.
  RC-12:
    title: ఆనకట్ట విడుదల సమాచారం
    category: హెచ్చరికలు
    guidance: ఆనకట్ట నుంచి నీరు విడుదల చేయకముందే దిగువ గ్రామాలకు సమాచారం కావాలి. ఆనకట్ట అధికారులతో ముందుగా సమన్వయం చేయండి; స్పష్టమైన హెచ్చరికలతో నెమ్మదిగా, దశలవారీ విడుదల ప్రజలకు తరలడానికి సమయం ఇస్తుంది.
  RC-13:
    title: మత్స్యకార సమాజాల తుపాను సన్నద్ధత
    category: తుపాను
    guidance: తుపాను హెచ్చరిక రాగానే, తీరం దాటడానికి చాలా ముందే, చేపల పడవలను వెనక్కి పిలవండి. గాలి పెరిగితే రోడ్లు, విద్యుత్ నిలిచిపోతాయి కాబట్టి తీర కుటుంబాలను ముందుగా తుపాను ఆశ్రయాలకు తరలించండి.
  RC-14:
    title: బయటి సహాయాన్ని ముందుగా కోరడం
    category: సమన్వయం
    guidance: జిల్లా, రాష్ట్ర బృందాలు గ్రామాన్ని చేరడానికి సమయం పడుతుంది. స్థానిక వనరులు సరిపోవనిపించగానే బయటి సహాయం కోరండి, అవి అయిపోయేవరకు ఆగవద్దు.
