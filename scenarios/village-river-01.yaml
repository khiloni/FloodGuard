id: "village-river-01"
name: "Riverbank Village Flood Response"
version: "2.1.0"
description: "A rising tributary threatens three wards. Warn and evacuate before the flood crests, protect people during it, then lead the recovery: clean water, medical care, power, roads and a safe return home."
total_ticks: 30

# Scenario-select card
hazard_type: "river_flood"
hazard_label: "River flood"
difficulty_label: "Moderate"
illustration: "river"
hook: "A monsoon tributary is rising beside three wards. Warn, evacuate and protect the bund, then lead the recovery."
languages: ["en", "hi", "gu", "mr", "bn", "ta", "te", "kn"]

difficulty:
  easy:
    resources_pct: 130
    forecast_offset_cm: -20
    support_delay_delta: -1
  hard:
    resources_pct: 75
    forecast_offset_cm: 15
    support_delay_delta: 2

external_support:
  uses: 1
  delay_ticks: 4
  boats: 1
  vehicles: 2
  sandbags: 200
  supply_units: 40
tick_duration_minutes: 30

resources:
  boats: 2
  boat_capacity: 15
  vehicles: 3
  vehicle_capacity: 20
  sandbags: 400

embankment:
  initial_height_cm: 380
  initial_integrity: 100
  sandbags_per_reinforce: 100
  height_gain_per_reinforce_cm: 30
  max_reinforced_height_cm: 470

water_forecast_cm:
  - 160
  - 180
  - 205
  - 235
  - 270
  - 305
  - 340
  - 375
  - 410
  - 440
  - 465
  - 475
  - 470
  - 455
  - 430
  - 400
  - 370
  - 340
  - 310
  - 280
  - 250
  - 225
  - 200
  - 180
  - 165
  - 150
  - 140
  - 130
  - 120
  - 110

# Part 2: phases and recovery. All values are integers used by the engine.
phases:
  flood_starts_at_cm: 300   # warning level: before -> flood
  recovery_below_cm: 380    # danger level, after the peak: flood -> recovery

recovery:
  shelter_supplies_initial: 30
  people_per_supply_unit: 60      # 1 unit per started 60 sheltered people per tick
  supply_deliveries: 3
  units_per_delivery: 40
  supplies_low_threshold: 10
  clean_water_kits: 1
  medical_teams: 1
  return_batch_per_turn: 100
  treat_per_tick: 6
  road_debris_depth_cm: 30
  disease:
    base: 20
    per_flooded_zone: 10
    breach_bonus: 10
    rise_per_tick: 5
    crowding_pct: 90
    crowding_rise: 3
    no_supplies_rise: 4
    clean_water_drop: 8
    medical_camp_drop: 6
    high_threshold: 60
  trust:
    initial: 60
    early_warning_bonus: 10
    early_warning_by_tick: 6
    losses_penalty: 10
    breach_penalty: 10
    supplies_ran_out_penalty: 10

zones:
  - id: "ward-1"
    name: "Ward 1 (Lowland Riverside)"
    elevation_cm: 220
    population: 120
    vulnerable: 30
    road_cutoff_depth_cm: 30

  - id: "ward-2"
    name: "Ward 2 (Market Settlement)"
    elevation_cm: 360
    population: 180
    vulnerable: 40
    road_cutoff_depth_cm: 40

  - id: "ward-3"
    name: "Ward 3 (Highland Ridge)"
    elevation_cm: 520
    population: 100
    vulnerable: 15
    road_cutoff_depth_cm: 50

shelters:
  - id: "school"
    name: "Government High School Shelter"
    elevation_cm: 500
    capacity: 320
    is_open: false

npcs:
  - id: "village_head"
    name: "Sarpanch Ramesh"
    role: "Elected Village Representative"
    location: "ward-2"
    initial_dialogue: "Water is swelling rapidly near Ward 1. The villagers look to us for clear instructions. Should we issue a formal alert?"

  - id: "rescue_worker"
    name: "Officer Sunita"
    role: "Civil Defence Volunteer"
    location: "ward-1"
    initial_dialogue: "We have two motorized rescue boats and three transport trucks primed at the depot. Sandbagging supplies are ready."

  - id: "family_member"
    name: "Mohan"
    role: "Resident caring for elderly parents"
    location: "ward-1"
    initial_dialogue: "My parents have mobility constraints. Please prioritize evacuation transport for our elders before the causeway goes underwater."

  - id: "health_worker"
    name: "Nurse Kavita"
    role: "Primary health centre nurse"
    location: "ward-2"
    initial_dialogue: "If people stay in the shelter for long, we must think about drinking water and medicines."

  - id: "district_official"
    name: "Ms. Desai"
    role: "District disaster management officer"
    location: "school"
    initial_dialogue: "The district can send a convoy with boats, trucks and relief, but it takes time to arrive."

