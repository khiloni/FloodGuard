id: "dam-release-01"
name: "Below Kalindi Dam"
version: "1.0.0"
description: "Heavy rain upstream forces a scheduled release from Kalindi Dam. The river below is already high. Timing and getting the message to every village decide the outcome."
total_ticks: 30
tick_duration_minutes: 30

# Scenario-select card
hazard_type: "dam_release"
hazard_label: "Dam release downstream"
difficulty_label: "Moderate"
illustration: "dam"
hook: "The dam must release water in a few hours. Can you warn every village in time, and get the release slowed down?"
languages: ["en", "hi"]

difficulty:
  easy:
    resources_pct: 130
    forecast_offset_cm: -20
    support_delay_delta: -1
    mechanic_params:
      notice_ticks: 4
  hard:
    resources_pct: 75
    forecast_offset_cm: 15
    support_delay_delta: 2
    mechanic_params:
      notice_ticks: 2
      release_cm: 180

resources:
  boats: 3
  boat_capacity: 12
  vehicles: 2
  vehicle_capacity: 20
  sandbags: 400

embankment:
  initial_height_cm: 400
  initial_integrity: 100
  max_reinforced_height_cm: 470

contained_safe_elevation_cm: 400

# River level from rain only (cm); the dam release is added on top by the engine.
water_forecast_cm: [180, 190, 200, 215, 230, 245, 260, 275, 285, 295, 300, 295, 285, 270, 255, 240, 225, 210, 200, 190, 185, 180, 175, 170, 165, 160, 158, 156, 154, 152]

mechanic:
  type: "dam_release"
  params:
    release_tick: 9
    release_ticks: 4
    release_cm: 160
    notice_ticks: 3
    staggered_pct: 55

external_support:
  uses: 1
  delay_ticks: 5
  boats: 2
  vehicles: 1
  sandbags: 300
  supply_units: 40

phases:
  flood_starts_at_cm: 280
  recovery_below_cm: 360

recovery:
  shelter_supplies_initial: 30
  people_per_supply_unit: 60
  supply_deliveries: 3
  units_per_delivery: 40
  supplies_low_threshold: 10
  clean_water_kits: 1
  medical_teams: 1
  return_batch_per_turn: 100
  treat_per_tick: 6
  road_debris_depth_cm: 30
  disease:
    base: 20
    per_flooded_zone: 10
    breach_bonus: 10
    rise_per_tick: 5
    crowding_pct: 90
    crowding_rise: 3
    no_supplies_rise: 4
    clean_water_drop: 8
    medical_camp_drop: 6
    high_threshold: 60
  trust:
    initial: 60
    early_warning_bonus: 10
    early_warning_by_tick: 6
    losses_penalty: 10
    breach_penalty: 10
    supplies_ran_out_penalty: 10

zones:
  - id: "ghat-village"
    name: "Ghat Village"
    elevation_cm: 260
    population: 150
    vulnerable: 35
  - id: "temple-hamlet"
    name: "Temple Hamlet"
    elevation_cm: 340
    population: 130
    vulnerable: 25
  - id: "upper-farms"
    name: "Upper Farms"
    elevation_cm: 440
    population: 90
    vulnerable: 15

shelters:
  - id: "hilltop-school"
    name: "Hilltop School"
    elevation_cm: 520
    capacity: 320
    is_open: false

npcs:
  - id: "village_head"
    name: "Sarpanch Lakshmi"
    role: "Village head of Ghat Village"
    location: "ghat-village"
    initial_dialogue: "Many families here farm on the riverbank. If the dam opens without notice, they will be caught in the fields."
  - id: "rescue_worker"
    name: "Constable Imran"
    role: "Police and rescue volunteer"
    location: "ghat-village"
    initial_dialogue: "We have three boats at the ghat and two jeeps. The low bridge to Temple Hamlet floods quickly."
  - id: "family_member"
    name: "Gopal"
    role: "Ghat Village farmer"
    location: "ghat-village"
    initial_dialogue: "My mother cannot walk far. Will someone tell us before the water comes?"
  - id: "health_worker"
    name: "ASHA worker Meena"
    role: "Community health worker"
    location: "temple-hamlet"
    initial_dialogue: "I know which houses have elderly people and pregnant women. They need to move first."
  - id: "district_official"
    name: "Mr. Kulkarni"
    role: "Dam control room liaison"
    location: "hilltop-school"
    initial_dialogue: "The dam engineers must release water to keep the dam safe. They may agree to release it more slowly if we ask early."

