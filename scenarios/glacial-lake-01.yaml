id: "glacial-lake-01"
name: "Glacial Lake Burst above Tsomo Valley"
version: "1.0.0"
description: "Sensors on a glacial lake high above a mountain valley warn that its moraine wall may give way. If it bursts, a wall of water and debris reaches the valley within hours. Use the short warning window to move everyone uphill, then reopen the valley."
total_ticks: 28
tick_duration_minutes: 15

# Scenario-select card
hazard_type: "glacial_lake_outburst"
hazard_label: "Glacial lake outburst"
difficulty_label: "Very hard"
illustration: "mountain"
hook: "Lake sensors high above the valley just tripped. You have about two hours before a surge of water and boulders arrives."
languages: ["en", "hi", "gu", "mr", "bn", "ta", "te", "kn"]

difficulty:
  easy:
    resources_pct: 130
    forecast_offset_cm: -25
    support_delay_delta: -1
  hard:
    resources_pct: 75
    forecast_offset_cm: 20
    support_delay_delta: 1

resources:
  boats: 1
  boat_capacity: 8
  vehicles: 4
  vehicle_capacity: 20
  sandbags: 200

embankment:
  initial_height_cm: 280
  initial_integrity: 100
  sandbags_per_reinforce: 100
  height_gain_per_reinforce_cm: 20
  max_reinforced_height_cm: 320

# Ground above this stays dry while the gabion wall holds.
contained_safe_elevation_cm: 300

# Guided groups on steep paths
foot_evacuation_per_tick: 25

# River level at the valley gauge (cm). Meltwater rises slowly, then the outburst surge arrives at tick 9.
water_forecast_cm: [110, 115, 122, 130, 140, 152, 168, 190, 260, 380, 440, 410, 360, 310, 270, 240, 215, 196, 182, 170, 160, 152, 146, 140, 135, 131, 128, 125]

external_support:
  uses: 1
  delay_ticks: 3
  boats: 0
  vehicles: 3
  sandbags: 100
  supply_units: 50

phases:
  flood_starts_at_cm: 185
  recovery_below_cm: 280

recovery:
  shelter_supplies_initial: 25
  people_per_supply_unit: 60
  supply_deliveries: 3
  units_per_delivery: 40
  supplies_low_threshold: 10
  clean_water_kits: 1
  medical_teams: 1
  return_batch_per_turn: 100
  treat_per_tick: 6
  road_debris_depth_cm: 25
  disease:
    base: 15
    per_flooded_zone: 10
    breach_bonus: 10
    rise_per_tick: 4
    crowding_pct: 90
    crowding_rise: 3
    no_supplies_rise: 4
    clean_water_drop: 8
    medical_camp_drop: 6
    high_threshold: 60
  trust:
    initial: 60
    early_warning_bonus: 10
    early_warning_by_tick: 3
    losses_penalty: 10
    breach_penalty: 10
    supplies_ran_out_penalty: 10

zones:
  - id: "river-bazaar"
    name: "Riverside Bazaar"
    elevation_cm: 175
    population: 150
    vulnerable: 30
    road_cutoff_depth_cm: 25
  - id: "hydro-camp"
    name: "Hydropower Workers' Camp"
    elevation_cm: 230
    population: 100
    vulnerable: 10
    road_cutoff_depth_cm: 30
  - id: "monastery-hamlet"
    name: "Monastery Hamlet"
    elevation_cm: 400
    population: 120
    vulnerable: 35
    road_cutoff_depth_cm: 40

shelters:
  - id: "ridge-camp"
    name: "Army Transit Camp on the Ridge"
    elevation_cm: 650
    capacity: 240
    is_open: false
  - id: "monastery-hall"
    name: "Monastery Prayer Hall"
    elevation_cm: 560
    capacity: 140
    is_open: false

npcs:
  - id: "village_head"
    name: "Panchayat President Dorjee"
    role: "Elected panchayat president"
    location: "river-bazaar"
    initial_dialogue: "Shopkeepers say the river is only a little higher than usual. They will not close the bazaar unless the warning is loud and clear."
  - id: "rescue_worker"
    name: "Inspector Lhamu"
    role: "State disaster response force"
    location: "hydro-camp"
    initial_dialogue: "Four trucks, one rubber raft. In a debris surge the raft is useless; the trucks are our real lifeline until the road goes."
  - id: "family_member"
    name: "Pemba"
    role: "Shopkeeper caring for his grandmother"
    location: "river-bazaar"
    initial_dialogue: "My grandmother is ninety and cannot climb the monastery steps. Please send a vehicle for the old people first."
  - id: "health_worker"
    name: "Dr. Chettri"
    role: "Primary health centre doctor"
    location: "monastery-hamlet"
    initial_dialogue: "Cold nights on the ridge will be hard for babies and elders. We will need blankets, clean water and a medical camp."
  - id: "district_official"
    name: "Ms. Rai"
    role: "District emergency operations centre"
    location: "ridge-camp"
    initial_dialogue: "The lake sensors sent an alarm. Cell broadcast is ready, but the decision to sound the sirens is yours."

