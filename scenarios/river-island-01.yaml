      shelter_id: "raised-platform"
      transport_modes: ["boat", "foot"]
      road_cutoff_depth_cm: 25
      waypoints: [[310, 365], [380, 352], [440, 360], [495, 360]]
    - zone_id: "ghat-bank"
      shelter_id: "mainland-school"
      transport_modes: ["vehicle", "foot"]
      road_cutoff_depth_cm: 40
      waypoints: [[220, 95], [420, 120], [620, 100], [780, 80]]
  decor:
    islands: [[500, 395, 360, 120], [880, 520, 70, 22], [110, 540, 60, 18]]
    trees: [[60, 90], [380, 60], [470, 160], [680, 150], [960, 130], [235, 450], [520, 460], [760, 455], [430, 440]]
    hills: [[600, 20], [940, 30]]
    jetty: { x: 420, y: 180, label: "Mainland ghat" }
    bridges: []
  recovery_sites:
    water_point: { x: 560, y: 120, label: "Chlorination point" }
    medical_camp: { x: 495, y: 470, label: "Medical camp on the platform" }
    substation: { x: 370, y: 160, label: "Solar micro-grid" }
    health_centre: { x: 680, y: 60, label: "Sub-centre" }
    supply_depot: { x: 950, y: 90, label: "Relief depot" }
