services:
  - type: web
    name: floodguard
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: LLM_MODE
        value: template
      - key: MAX_INPUT_CHARS
        value: "400"
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      - key: PORT
        value: "10000"
