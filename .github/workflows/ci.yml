name: FloodGuard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-licenses

      - name: Verify Python dependency licenses against allowlist
        run: |
          pip-licenses --allow-only="MIT License;BSD License;Apache Software License;Python Software Foundation License;Public Domain;ISC License (ISCL);Mozilla Public License 2.0 (MPL 2.0)"

      - name: Run Pytest Suite
        run: |
          pytest -v -p no:opik -p no:langsmith
